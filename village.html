<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le village de Mamie</title>
<meta name="theme-color" content="#2E5E3A">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap">
<style>
/* V3, étape 1 : le moteur (CONCEPTION-V3.md). Le squelette de Forge of Empires : un terrain en losanges qu'on agrandit,
   des bâtiments posés et déplacés librement, reliés par des chemins à la place, trois durées de production.
   Le plaisir du geste : sons, étincelles, pièces qui volent au compteur, rebond, jour et nuit, musique qu'on coupe. */
:root{
  --gold:#F0C04A; --gold-deep:#C99A22; --gold-ink:#2B1F00;
  --paper:#FBF5E6; --ink:#1E1A14; --ink-dim:#5A5145; --line:#D9CDB4;
  --f-display:"Libre Baskerville", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow-x:hidden}
body{margin:0;font-family:var(--f-body);font-size:22px;line-height:1.3;color:var(--ink);
  background:linear-gradient(180deg,#CFE8C2,#F4F8E8) fixed;transition:background 2s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.nuit{background:linear-gradient(180deg,#22314F,#3C4A63) fixed}
body.nuit .haut h1{color:#FFF3D6}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:28px;margin:0 8px 0 0}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px;min-height:44px;box-sizing:border-box}
.pill.gonfle{animation:gonfle .45s}
@keyframes gonfle{40%{transform:scale(1.3);background:#FFF1B8}}
.son{min-width:56px;min-height:48px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:26px}
.milieu{flex:1;display:flex;gap:14px;min-height:0;margin-top:8px}
.carte{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.carte svg{width:100%;height:100%;max-height:calc(100vh - 190px);touch-action:manipulation}
.cote{width:290px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
@media (max-width:900px){.milieu{flex-direction:column}.cote{width:auto;flex:1}.carte{flex:0 0 auto;height:52vh}.carte svg{max-height:52vh}}
.aide{background:#FFF4CC;border:3px solid var(--gold);border-radius:18px;padding:10px 14px;font-size:20px;font-weight:700;line-height:1.35}
.msg{background:#FFFDF6;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;min-height:56px}
.bas{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-width:150px;font-size:24px;font-weight:700;min-height:76px;border-radius:18px;border:0;
  background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 var(--gold-deep);display:flex;align-items:center;justify-content:center;gap:10px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.big.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #B8B09C}
.big.vert{background:#7BB661;color:#fff;box-shadow:0 5px 0 #4E8A3A}
.big[disabled]{opacity:.45;cursor:default}
.big .e{font-size:30px}
.voile{position:fixed;inset:0;background:rgba(30,26,20,.35);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.feuille{background:var(--paper);border-radius:24px 24px 0 0;padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px));width:min(900px,100%);box-sizing:border-box;max-height:82vh;overflow:auto}
.feuille h2{font-family:var(--f-display);font-size:28px;margin:0 0 4px}
.feuille .sous{font-size:20px;color:var(--ink-dim);margin:0 0 14px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.choix{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px;font-weight:700;min-height:130px}
.choix .e{font-size:44px;line-height:1}
.choix small{font-weight:400;color:var(--ink-dim);font-size:16px;text-align:center}
.choix[disabled]{opacity:.45;cursor:default}
.vente{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vente .nom{flex:1;min-width:180px;font-size:21px}
.vente button{font-size:19px;font-weight:700;min-height:52px;padding:0 16px;border-radius:14px;border:2px solid var(--gold-deep);background:var(--gold)}
.vente button[disabled]{opacity:.4}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.actions .big{min-width:220px}
.fermer{float:right;font-size:20px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff}
.debut{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#CFE8C2,#F4F8E8);z-index:6;padding:16px;box-sizing:border-box}
.debut .boite{background:var(--paper);border-radius:24px;padding:28px;max-width:560px;text-align:center;border:2px solid var(--line)}
.champ{font-size:32px;font-weight:700;padding:12px 18px;border-radius:16px;border:4px solid var(--gold);width:100%;box-sizing:border-box;text-align:center;margin:14px 0;font-family:var(--f-body)}
/* Bulles, rebond, poussière, étincelles, vols */
.flotte{animation:flotte 1.6s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-7px)}}
.brille{animation:flotte 1.6s ease-in-out infinite, brille 1.2s ease-in-out infinite}
@keyframes brille{50%{filter:drop-shadow(0 0 8px #FFE27A) brightness(1.12)}}
.tombe{animation:tombe .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tombe{0%{transform:translateY(-70px) scaleY(1.1);opacity:0}60%{transform:translateY(4px) scaleY(.9);opacity:1}100%{transform:none}}
.porte{opacity:.55;animation:flotte 1s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.vol{position:fixed;font-size:34px;transition:transform .8s cubic-bezier(.5,-.3,.6,1), opacity .8s;will-change:transform}
.etin{position:fixed;width:10px;height:10px;border-radius:50%;background:#FFE27A;box-shadow:0 0 8px #FFD23F;animation:etin .7s ease-out forwards}
@keyframes etin{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.poussiere{position:fixed;width:26px;height:16px;border-radius:50%;background:rgba(200,180,140,.75);animation:pouss .7s ease-out forwards}
@keyframes pouss{to{transform:translate(var(--dx),-10px) scale(2.2);opacity:0}}
svg text{font-family:var(--f-body)}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
/* ===================== Données : l'époque Hameau, six bâtiments ===================== */
const RES={pieces:{e:'🪙',nom:'pièces'},etoiles:{e:'⭐',nom:'étoiles'},legumes:{e:'🥕',nom:'légumes',vend:2},bois:{e:'🪵',nom:'bois',vend:2},oeufs:{e:'🥚',nom:'œufs',vend:3},
 fleurs:{e:'💐',nom:'bouquets',vend:4},fruits:{e:'🍎',nom:'fruits',vend:4},farine:{e:'🌾',nom:'farine',vend:5},pain:{e:'🍞',nom:'pains',vend:8},outils:{e:'🔧',nom:'outils',vend:10}};
/* sorte : maison (pièces chaque heure), atelier (3 durées), deco (bonus autour), chemin */
const BAT={
 maison:{nom:'Maison de bois',e:'🏠',sorte:'maison',t:2,cout:{pieces:60},parHeure:10,aide:'Donne des pièces chaque heure ; la réserve tient 3 jours.'},
 potager:{nom:'Potager',e:'🥕',sorte:'atelier',t:2,cout:{pieces:40},produit:'legumes',aide:'Des légumes, en 5 minutes, 1 heure ou 8 heures.'},
 bucheron:{nom:'Cabane du bûcheron',e:'🪓',sorte:'atelier',t:2,cout:{pieces:70},produit:'bois',mur:'#B07A4A',toit:'#6B4A2E',aide:'Du bois pour construire.'},
 poulailler:{nom:'Poulailler',e:'🐔',sorte:'atelier',t:2,cout:{pieces:90,bois:10},produit:'oeufs',mur:'#F2E3C4',toit:'#B5523A',aide:'Des œufs, qui se vendent bien.'},
 puits:{nom:'Puits',e:'🪣',sorte:'deco',t:1,cout:{pieces:80,bois:15},bonus:.2,aide:'Les bâtiments tout autour produisent 20 % de plus.'},
 massif:{nom:'Massif de fleurs',e:'🌷',sorte:'deco',t:1,cout:{pieces:30,legumes:5},bonus:.1,aide:'Les bâtiments tout autour produisent 10 % de plus.'},
 chemin:{nom:'Chemin',e:'🟫',sorte:'chemin',t:1,cout:{pieces:2},aide:'Relie les bâtiments à la place du village.'},
 // époque Village
 boulangerie:{nom:"Boulangerie d'Hugo",e:'🥖',sorte:'atelier',t:2,ep:1,cout:{pieces:200,bois:30},produit:'pain',mur:'#F6DDB2',toit:'#B5651D',aide:'Hugo fait du pain.'},
 fleuriste:{nom:'Fleurs de Chloé',e:'💐',sorte:'atelier',t:2,ep:1,cout:{pieces:180,legumes:20},produit:'fleurs',mur:'#FADDE6',toit:'#C2457A',aide:'Chloé compose des bouquets.'},
 verger:{nom:'Verger',e:'🍎',sorte:'atelier',t:2,ep:1,cout:{pieces:150,bois:20},produit:'fruits',aide:'Des pommes et des poires.'},
 moulin:{nom:'Moulin',e:'🌾',sorte:'atelier',t:2,ep:1,cout:{pieces:250,bois:50},produit:'farine',mur:'#EFE6D2',toit:'#8D6E4F',aide:'De la farine pour le village.'},
 // époque Bourg
 marche:{nom:'Marché couvert',e:'🏪',sorte:'maison',t:2,ep:2,cout:{pieces:600,pain:15},parHeure:40,mur:'#E8D9B5',toit:'#C0392B',aide:'Des pièces chaque heure, bien plus qu\'une maison.'},
 atelier:{nom:'Atelier de Pierre',e:'🔧',sorte:'atelier',t:2,ep:2,cout:{pieces:500,bois:80,oeufs:30},produit:'outils',mur:'#DADAD2',toit:'#55534C',aide:'Pierre fabrique des outils.'},
 fontaine:{nom:'Fontaine',e:'⛲',sorte:'deco',t:1,ep:2,cout:{pieces:400,farine:20},bonus:.3,aide:'Les bâtiments tout autour produisent 30 % de plus.'},
 // époque Ville fleurie
 mairie:{nom:'Mairie',e:'🏛️',sorte:'maison',t:2,ep:3,cout:{pieces:1500,outils:20},parHeure:80,mur:'#E9EEF5',toit:'#3A6EA5',aide:'La fierté du village : beaucoup de pièces chaque heure.'},
 kiosque:{nom:'Kiosque à musique',e:'🎶',sorte:'deco',t:1,ep:3,cout:{pieces:900,fleurs:40},bonus:.4,aide:'Les bâtiments tout autour produisent 40 % de plus.'},
 serre:{nom:'Serre',e:'🌿',sorte:'atelier',t:2,ep:3,cout:{pieces:1000,fruits:40},produit:'fleurs',mult:2,mur:'#CFE8EE',toit:'#9FC9D3',aide:'Deux fois plus de bouquets.'}};
Object.values(BAT).forEach(B=>{B.ep=B.ep||0});
/* Les époques de Forge of Empires : la frise se parcourt dans l'ordre ; une case « époque » fait monter tout le village. */
const EPOQUES=[
 {id:'hameau',nom:'Hameau',chemin:['#E2CF9E','#C9B47F'],place:'#D9D2C0'},
 {id:'village',nom:'Village',chemin:['#D8B98A','#B9986A'],place:'#D6C3A0',phrase:'Chloé : « Des toits de chaume partout ! Je vais enfin pouvoir ouvrir ma boutique. »'},
 {id:'bourg',nom:'Bourg',chemin:['#C9C4BA','#9E978A'],place:'#BDB8AE',phrase:'Chloé : « Des pavés et une vraie place ! Pierre installe son atelier. »'},
 {id:'ville',nom:'Ville fleurie',chemin:['#E3BDB2','#C29A8E'],place:'#E8D2C8',phrase:'Chloé : « Que de fleurs ! On dirait une carte postale. »'}];
const FRISE=[
 {id:'ep-village',epoque:1,cout:{etoiles:15,pieces:150}},
 {id:'boulangerie',cout:{etoiles:10,pieces:100}},{id:'fleuriste',cout:{etoiles:10,pieces:100}},{id:'verger',cout:{etoiles:8,pieces:80}},{id:'moulin',cout:{etoiles:12,pieces:120}},
 {id:'ep-bourg',epoque:2,cout:{etoiles:60,pieces:800,pain:10}},
 {id:'marche',cout:{etoiles:25,pieces:300}},{id:'atelier',cout:{etoiles:25,pieces:300}},{id:'fontaine',cout:{etoiles:20,pieces:200}},
 {id:'ep-ville',epoque:3,cout:{etoiles:150,pieces:2500,outils:20}},
 {id:'mairie',cout:{etoiles:50,pieces:800}},{id:'kiosque',cout:{etoiles:40,pieces:600}},{id:'serre',cout:{etoiles:40,pieces:600}}];
const epIdx=()=>Math.max(0,EPOQUES.findIndex(e=>e.id===S.epoque));
const debloque=k=>BAT[k].ep===0||S.frise.includes(k);
const mult=o=>(1+.5*(o.ep||0))*(BAT[o.type].mult||1)*(1+(window.BONUS_MONUMENT||0));   // le monument (saisons.js) : +5 % par niveau
const coutMonter=o=>({pieces:60*((o.ep||0)+1)*BAT[o.type].t*BAT[o.type].t});
/* Images d'époque : img/v3/<type>-<époque>.webp si elle existe ; sinon une image plus ancienne ; sinon le dessin. */
const IMGS={}, ANCIENNES={maison:'maison-1',boulangerie:'boulangerie',fleuriste:'fleuriste',atelier:'garage',mairie:'mairie'};
let attenteImg=null;
// La liste des images réellement déposées dans img/v3 (remplie à l'assemblage) : aucune requête à l'aveugle, aucune erreur 404.
const IMAGES_V3=['atelier-bourg','boulangerie-village','bucheron-hameau','fleuriste-village','fontaine-bourg','kiosque-ville','maison-hameau','marche-bourg','massif-hameau','poulailler-hameau','puits-hameau','serre-ville'];
/* Calage mesuré sur chaque image : [x gauche, y gauche, x droite, y droite, largeur, hauteur] de la face du dessus de son bloc.
   Cette face tombe pile sur le losange de l'emprise ; le reste est coupé en prisme (voir imageCalee). */
const CALAGE={'v3/atelier-bourg':[46,194,352,193,400,391],'v3/boulangerie-village':[43,191,356,189,400,391],'v3/bucheron-hameau':[39,197,360,196,400,391],
 'v3/fleuriste-village':[46,191,352,189,400,391],'v3/fontaine-bourg':[38,193,361,195,400,391],'v3/kiosque-ville':[40,192,358,189,400,391],
 'v3/maison-hameau':[46,190,352,185,400,391],'v3/marche-bourg':[42,196,357,192,400,391],'v3/massif-hameau':[26,169,372,168,400,391],
 'v3/poulailler-hameau':[43,191,355,190,400,391],'v3/puits-hameau':[32,183,366,184,400,391],'v3/serre-ville':[44,208,355,207,400,391],
 'maison-1':[0,199,399,186,400,391],'mairie':[0,145,385,150,386,400],'garage':[0,201,382,210,383,400],'fleuriste':[0,217,386,209,387,400],'boulangerie':[0,188,393,188,394,400]};
IMAGES_V3.forEach(cle=>{const im=new Image();
  im.onload=()=>{IMGS[cle]=true;clearTimeout(attenteImg);attenteImg=setTimeout(()=>{if(S&&!feuille)rendu()},300)};im.src='img/v3/'+cle+'.webp'});
function imageDe(o){for(let e=o.ep||0;e>=0;e--){const cle=o.type+'-'+EPOQUES[e].id;if(IMGS[cle])return 'v3/'+cle}return ANCIENNES[o.type]||null}
const DUREES=[{min:5,nom:'Petit',q:3,et:1},{min:60,nom:'Moyen',q:12,et:3},{min:480,nom:'Gros, pour la nuit',q:40,et:8}];
const MONDE=16, BLOC=4;                         // 16 × 16 cases, découpées en blocs de 4 × 4 ; on part des 4 blocs du centre
const PLACE={i:7,j:7};                          // la place du village, 2 × 2, fixe : c'est là que mènent les chemins
const PRIX_EXT=n=>150*Math.pow(2,n);

/* ===================== Mémoire de la tablette ===================== */
const CLE='village3:etat';
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const uid=()=>Math.random().toString(36).slice(2,9);
function neuf(nom){
  const t=Date.now(), b=[];
  const pose=(type,i,j,extra)=>b.push(Object.assign({id:uid(),type,i,j},extra||{}));
  pose('maison',4,6,{depuis:t-75*60000});
  pose('potager',10,6,{fin:t-1000,duree:0});           // une première récolte prête : la première visite a déjà de quoi ramasser
  pose('massif',9,9);
  [[6,6],[6,7],[9,6],[9,7]].forEach(([i,j])=>pose('chemin',i,j));
  return {v:3,nom,blocs:['1,1','1,2','2,1','2,2'],ext:0,b,
    stock:{pieces:150,etoiles:0,legumes:0,bois:10,oeufs:0},musique:true,epoque:'hameau',frise:[]};
}
let S=null;
try{S=JSON.parse(ls.get(CLE))}catch{}
if(S&&S.v!==3)S=null;
if(S&&!S.epoque)S.epoque='hameau';
if(S&&!S.frise)S.frise=[];   // contrat lu par habitants.js et saisons.js : 'hameau' | 'village' | 'bourg' | 'ville'
function sauve(){ls.set(CLE,JSON.stringify(S))}

/* ===================== Outils ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let message='', feuille=null, mode=null, dernierPose=null, fete=false;   // mode : {pose:type} | {deplace:id} | {chemins:true}
const assez=c=>Object.entries(c).every(([k,v])=>(S.stock[k]||0)>=v);
const paye=c=>Object.entries(c).forEach(([k,v])=>S.stock[k]-=v);
const txt=c=>Object.entries(c).map(([k,v])=>v+' '+RES[k].e).join(' + ');
const heure=ms=>{const d=new Date(ms);return d.getHours()+' h '+String(d.getMinutes()).padStart(2,'0')};
const possede=(i,j)=>i>=0&&j>=0&&i<MONDE&&j<MONDE&&S.blocs.includes(Math.floor(i/BLOC)+','+Math.floor(j/BLOC));
const surPlace=(i,j)=>i>=PLACE.i&&i<PLACE.i+2&&j>=PLACE.j&&j<PLACE.j+2;
const occupe=(i,j,sauf)=>S.b.find(o=>o.id!==sauf&&i>=o.i&&i<o.i+BAT[o.type].t&&j>=o.j&&j<o.j+BAT[o.type].t);
function libre(type,i,j,sauf){const t=BAT[type].t;for(let a=0;a<t;a++)for(let c=0;c<t;c++){
  if(!possede(i+a,j+c)||surPlace(i+a,j+c)||occupe(i+a,j+c,sauf))return false}return true}

/* Les chemins : un bâtiment est relié si une case qui le borde est la place ou un chemin relié à la place. */
function relies(){
  const ok=new Set(), file=[];
  for(let a=0;a<2;a++)for(let c=0;c<2;c++){ok.add((PLACE.i+a)+','+(PLACE.j+c));file.push([PLACE.i+a,PLACE.j+c])}
  while(file.length){const [i,j]=file.shift();
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=(i+di)+','+(j+dj),o=occupe(i+di,j+dj);
      if(!ok.has(k)&&o&&o.type==='chemin'){ok.add(k);file.push([i+di,j+dj])}}}
  return ok;
}
function estRelie(o,ok){const t=BAT[o.type].t;
  for(let a=-1;a<=t;a++)for(let c=-1;c<=t;c++){if((a<0||a>=t)===(c<0||c>=t))continue;if(ok.has((o.i+a)+','+(o.j+c)))return true}
  return false}
function bonus(o){let b=0;S.b.forEach(d=>{const B=BAT[d.type];if(B.sorte!=='deco')return;
  const t=BAT[o.type].t;if(d.i>=o.i-2&&d.i<=o.i+t+1&&d.j>=o.j-2&&d.j<=o.j+t+1)b+=B.bonus});return Math.min(b,.6)}
function pret(o,ok){const B=BAT[o.type];if(!estRelie(o,ok))return false;
  if(B.sorte==='atelier')return o.fin!=null&&Date.now()>=o.fin;
  if(B.sorte==='maison')return Date.now()-o.depuis>=60*60000;
  return false}
function gainMaison(o){const h=Math.min(72,Math.floor((Date.now()-o.depuis)/3600000));return Math.ceil(h*BAT[o.type].parHeure*mult(o)*(1+bonus(o)))}

/* ===================== Le son : petits bruits et musique douce, synthétisés (aucun fichier) ===================== */
let AC=null, musiqueMinuteur=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch{AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function note(f,t0,dur,type,vol){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();

      nature.push({o:i+j+(di+dj>0?1.4:-.1),svg:`<g stroke="#8D6E4F" stroke-width="2.4" stroke-linecap="round"><line x1="${A[0]}" y1="${A[1]-9}" x2="${B[0]}" y2="${B[1]-9}"/><line x1="${A[0]}" y1="${A[1]-4}" x2="${B[0]}" y2="${B[1]-4}"/><line x1="${A[0]}" y1="${A[1]}" x2="${A[0]}" y2="${A[1]-12}"/></g>`})})}
  achetables.forEach(bk=>{const [a,c]=bk.split(',').map(Number),[x,y]=P(a*BLOC+2,c*BLOC+2);
    nature.push({o:999,svg:`<g data-x="${bk}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="20" fill="#FFF9E8" stroke="#8A6A3E" stroke-width="3"/><text x="${x}" y="${y+8}" font-size="24" text-anchor="middle" font-weight="700" fill="#5A4630">+</text></g>`})});
  // la place du village, pavée
  h+=poly(los(PLACE.i,PLACE.j,2),EPOQUES[epIdx()].place,'#A79F8A','style="fill:url(#paves)"');
  const [px,py]=P(PLACE.i+1,PLACE.j+1);h+=`<rect x="${px-2}" y="${py-48}" width="4" height="48" fill="#6D4C41"/><polygon points="${px+2},${py-48} ${px+28},${py-40} ${px+2},${py-32}" fill="#E53935"/>`;
  h+=`<text x="${px}" y="${py+30}" font-size="15" font-weight="700" text-anchor="middle" fill="#3A3226" stroke="#FFFDF6" stroke-width="4" paint-order="stroke">La place</text>`;
  S.b.filter(o=>o.type==='chemin').forEach(o=>h+=dessinObjet(o,ok));
  const tout=nature.filter(x=>x.o<999);
  S.b.filter(o=>o.type!=='chemin').forEach(o=>tout.push({o:o.i+o.j+BAT[o.type].t,svg:dessinObjet(o,ok)}));
  tout.sort((a,b)=>a.o-b.o).forEach(x=>h+=x.svg);
  nature.filter(x=>x.o===999).forEach(x=>h+=x.svg);
  const vb=[x0+90,y0+10,x1-x0-180,y1-y0-40];
  const fond=`<rect x="${vb[0]-500}" y="${vb[1]-500}" width="${vb[2]+1000}" height="${vb[3]+1000}" fill="url(#ciel)"/>`;
  if(n)h+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#1A2A55" opacity=".28" pointer-events="none"/>`;
  return `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Le village vu de biais"><title>Le village</title>${motifs(sa)}${fond}${h}</svg>`;
}

/* ===================== Écran ===================== */
function rendu(){
  if(!S&&ls.get('rami:nom')){S=neuf(ls.get('rami:nom'));message='Bienvenue au village ! Touchez la bulle qui brille.';sauve();encaisser()}
  if(!S){
    $('#app').innerHTML=`<div class="debut"><div class="boite"><h1>Le village</h1>
      <label for="nom">Votre prénom</label><input id="nom" class="champ" maxlength="16" autocomplete="off">
      <button class="big" id="go" style="width:100%">Entrer au village</button></div></div>`;
    $('#go').onclick=()=>{const n=$('#nom').value.trim();if(!n){$('#nom').focus();return}ls.set('rami:nom',n);rendu()};
    return;
  }
  document.body.classList.toggle('nuit',nuit());
  const vus=['pieces','etoiles',...Object.keys(RES).filter(k=>k!=='pieces'&&k!=='etoiles'&&((S.stock[k]||0)>0||S.b.some(o=>BAT[o.type].produit===k)))];
  const pills=vus.map(k=>`<span class="pill" data-res="${k}" title="${RES[k].nom}">${RES[k].e} ${S.stock[k]||0}</span>`).join('');
  const bas=mode?`<button class="big vert" data-a="fini"><span class="e">✅</span>${mode.chemins?'Terminé':'Annuler'}</button>`
    :`<button class="big" data-a="construire"><span class="e">🔨</span>Construire</button>
     <button class="big alt" data-a="frise"><span class="e">⭐</span>Progrès</button>
     <button class="big alt" data-a="marche"><span class="e">⚖️</span>Marché</button>
     <button class="big alt" data-a="accueil"><span class="e">🏠</span>Accueil</button>`;
  const aide=mode?(mode.chemins?'Touchez les cases pour poser des chemins jusqu\'à la place. Touchez un chemin pour l\'enlever.':
      mode.deplace?'Touchez la case où le poser.':`Touchez une case claire pour poser : ${BAT[mode.pose].nom}.`)
    :'Touchez ce qui brille pour ramasser. Touchez ▶ pour lancer un travail. Un appui long sur un bâtiment le déplace.';
  $('#app').innerHTML=`
   <div class="haut"><h1>Le village de ${esc(S.nom)}</h1><div class="res">${pills}<button class="son" data-a="son" aria-label="${S.musique?'Couper la musique':'Remettre la musique'}">${S.musique?'🔊':'🔇'}</button></div></div>
   <div class="milieu"><div class="carte">${dessineVillage()}</div>
     <div class="cote"><div class="aide">${aide}</div><div class="msg" role="status">${message||(EPOQUES[epIdx()].nom+' : '+['la première époque.','les toits de chaume.','les pavés et la place.','les fleurs partout.'][epIdx()])}</div></div></div>
   <div class="bas">${bas}</div>${feuille?feuilleHTML():''}${fete?feteHTML():''}`;
  dernierPose=null;lier();
}
function cadre(titre,corps){return `<div class="voile" data-a="fermer"><div class="feuille" data-stop><button class="fermer" data-a="fermer">Fermer</button><h2>${titre}</h2>${corps}</div></div>`}
function feuilleHTML(){
  const f=feuille;
  if(f.quoi==='magasin')return cadre('🔨 Construire',`<p class="sous">Touchez un bâtiment, puis une case du village.</p><div class="grille">${Object.entries(BAT).filter(([k])=>debloque(k)).map(([k,B])=>
    `<button class="choix" data-pose="${k}" ${assez(B.cout)?'':'disabled'}><span class="e">${B.e}</span>${B.nom}<small>${B.aide}<br>${txt(B.cout)}</small></button>`).join('')}</div>`);
  if(f.quoi==='marche'){const l=Object.keys(RES).filter(k=>RES[k].vend&&S.stock[k]>0);
    return cadre('⚖️ Le marché',l.length?l.map(k=>`<div class="vente"><span class="nom">${RES[k].e} ${RES[k].nom} : <b>${S.stock[k]}</b></span><button data-vend="${k}" data-n="1">Vendre 1 · ${RES[k].vend} 🪙</button><button data-vend="${k}" data-n="${S.stock[k]}">Tout · ${RES[k].vend*S.stock[k]} 🪙</button></div>`).join('')
      :'<p class="sous">Rien à vendre pour l\'instant.</p>')}
  if(f.quoi==='extension'){const prix=PRIX_EXT(S.ext);
    return cadre('🌳 Agrandir le village',`<p class="sous">Un morceau de terrain de 4 × 4 cases de plus.</p><div class="actions"><button class="big" data-a="acheter" ${S.stock.pieces>=prix?'':'disabled'}>Agrandir pour ${prix} 🪙</button></div>`)}
  if(f.quoi==='bat'){const o=S.b.find(x=>x.id===f.id);if(!o)return '';const B=BAT[o.type],ok=relies();let corps=`<p class="sous">${B.aide}</p>`;
    if(B.sorte!=='deco'&&B.sorte!=='chemin'&&!estRelie(o,ok))corps+=`<p>🚧 Ce bâtiment n'est pas relié à la place. Posez des chemins jusqu'à lui (Construire → Chemin).</p>`;
    else if(B.sorte==='atelier'){
      if(o.fin==null)corps+=`<div class="grille">${DUREES.map((d,n)=>{const q=Math.ceil(d.q*mult(o)*(1+bonus(o)));return `<button class="choix" data-lance="${n}"><span class="e">${RES[B.produit].e}</span>${d.nom}<small>${d.min<60?d.min+' minutes':d.min/60+' heure'+(d.min>60?'s':'')}<br>donne ${q} ${RES[B.produit].e} et ${d.et} ⭐</small></button>`}).join('')}</div>`;
      else corps+=`<p>⏳ En cours : prêt vers <b>${heure(o.fin)}</b>. Rien ne se perd, ça attendra.</p>`}
    else if(B.sorte==='maison')corps+=`<p>🪙 ${gainMaison(o)} pièces en réserve. ${Date.now()-o.depuis<3600000?'Les prochaines vers <b>'+heure(o.depuis+3600000)+'</b>.':''}</p>`;
    if(bonus(o)>0&&B.sorte!=='deco')corps+=`<p>✨ Bonus des décorations voisines : +${Math.round(bonus(o)*100)} %.</p>`;
    if((o.ep||0)<epIdx())corps+=`<p>⬆️ Il peut monter à l'époque ${EPOQUES[(o.ep||0)+1].nom} : nouvelle allure et +50 % de production.</p>`;
    if(o.type!=='chemin')corps+=`<div class="actions">${(o.ep||0)<epIdx()?`<button class="big" data-a="monter" ${assez(coutMonter(o))?'':'disabled'}>⬆️ Monter d'époque : ${txt(coutMonter(o))}</button>`:''}<button class="big alt" data-a="deplacer">↔️ Déplacer</button></div>`;
    return cadre(`${B.e} ${B.nom}`,corps)}
  if(f.quoi==='frise'){let suivant=true;
    const cases=FRISE.map(c=>{const fait=S.frise.includes(c.id),ouvert=!fait&&suivant;if(!fait)suivant=false;
      const tit=c.epoque?`🎉 Époque ${EPOQUES[c.epoque].nom}`:`${BAT[c.id].e} ${BAT[c.id].nom}`;
      return `<button class="choix" data-case="${c.id}" ${ouvert&&assez(c.cout)?'':'disabled'} style="${c.epoque?'border-color:var(--gold);background:#FFF6D6':''}${fait?';opacity:.7':''}">
        <span class="e">${fait?'✅':ouvert?(c.epoque?'🎉':BAT[c.id].e):'🔒'}</span>${tit}<small>${fait?'fait':txt(c.cout)}</small></button>`}).join('');
    return cadre(`⭐ Le progrès du village · ${EPOQUES[epIdx()].nom}`,`<p class="sous">Les étoiles se gagnent en ramassant et en jouant aux cartes. Les cases s'ouvrent dans l'ordre.</p><div class="grille">${cases}</div>`)}
  return '';
}
function feteHTML(){const E=EPOQUES[epIdx()];
  return `<div class="voile" style="align-items:center;background:rgba(255,236,170,.92);z-index:9"><div style="text-align:center;padding:24px;max-width:700px">
    <div style="font-size:90px;line-height:1">🎉</div><h1 style="font-size:46px;margin:12px 0">Bienvenue au ${E.nom} !</h1>
    <p style="font-size:26px">${E.phrase}</p><p style="font-size:22px">Des bâtiments neufs vous attendent dans le Progrès, et chaque maison peut monter d'époque (⬆).</p>
    <button class="big" data-a="fete-ok" style="max-width:420px;margin:18px auto 0">Voir mon village</button></div></div>`}
function confettis(){const fx=$('#fx'),cs=['#E53935','#FDD835','#43A047','#1E88E5','#AB47BC','#FB8C00'];
  for(let n=0;n<90;n++){const e=document.createElement('div');e.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-20px;width:10px;height:16px;background:${cs[n%6]};z-index:10;transform:rotate(${Math.random()*360}deg);transition:transform 2.6s ease-in,top 2.6s ease-in`;
    fx.appendChild(e);setTimeout(()=>{e.style.top='105vh';e.style.transform=`rotate(${Math.random()*900}deg)`},30+Math.random()*600);setTimeout(()=>e.remove(),3400)}
  [0,.15,.3,.45].forEach((t,k)=>note([523,659,784,1047][k],t,.5,'triangle',.1))}

/* ===================== Gestes ===================== */
let appui=null;
function lier(){
  document.querySelectorAll('[data-stop]').forEach(e=>e.onclick=ev=>ev.stopPropagation());
  document.querySelectorAll('[data-a]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();premierGeste();action(e.dataset.a)}));
  document.querySelectorAll('[data-pose]').forEach(e=>e.onclick=()=>{const k=e.dataset.pose;feuille=null;mode=k==='chemin'?{chemins:true}:{pose:k};message='';rendu()});
  document.querySelectorAll('[data-vend]').forEach(e=>e.onclick=()=>{const k=e.dataset.vend,n=Math.min(+e.dataset.n,S.stock[k]);S.stock[k]-=n;S.stock.pieces+=n*RES[k].vend;
    message=`Vendu ${n} ${RES[k].e} pour ${n*RES[k].vend} pièces.`;SON.piece();sauve();rendu()});
  document.querySelectorAll('[data-case]').forEach(e=>e.onclick=()=>caseFrise(e.dataset.case));
  document.querySelectorAll('[data-lance]').forEach(e=>e.onclick=()=>lancer(feuille.id,+e.dataset.lance));
  document.querySelectorAll('[data-x]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();premierGeste();if(mode)return;feuille={quoi:'extension',bloc:e.dataset.x};rendu()});
  document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{premierGeste();appui=null;toucherCase(...e.dataset.c.split(',').map(Number))});
  document.querySelectorAll('g[data-o],polygon[data-o]').forEach(e=>{
    e.addEventListener('pointerdown',()=>{premierGeste();const id=e.dataset.o;appui={id,long:false,t:setTimeout(()=>{appui.long=true;
      if(BAT[S.b.find(o=>o.id===id).type].sorte!=='chemin'){mode={deplace:id};feuille=null;message='Touchez la case où le poser.';try{navigator.vibrate&&navigator.vibrate(30)}catch{}rendu()}},550)}});
    e.addEventListener('pointerup',()=>{if(appui)clearTimeout(appui.t)});
    e.addEventListener('pointerleave',()=>{if(appui)clearTimeout(appui.t)});
    e.addEventListener('click',ev=>{ev.stopPropagation();const fin=appui&&appui.long&&appui.id===e.dataset.o;appui=null;if(fin)return;toucherObjet(e.dataset.o,ev)});
  });
}
function action(a){
  if(a==='fermer')feuille=null;
  else if(a==='construire')feuille={quoi:'magasin'};
  else if(a==='marche')feuille={quoi:'marche'};
  else if(a==='frise')feuille={quoi:'frise'};
  else if(a==='fete-ok'){fete=false;message=EPOQUES[epIdx()].phrase}
  else if(a==='monter'){const o=S.b.find(x=>x.id===feuille.id),c=o&&coutMonter(o);if(o&&(o.ep||0)<epIdx()&&assez(c)){paye(c);o.ep=(o.ep||0)+1;dernierPose=o.id;feuille=null;
      message=`⬆️ ${BAT[o.type].nom} passe à l'époque ${EPOQUES[o.ep].nom} : +50 % de production.`;sauve();rendu();apresPose(o);const t=BAT[o.type].t,[x,y]=P(o.i+t/2,o.j+t/2);etincelles(...versEcran(x,y-30));return}}
  else if(a==='accueil'){sauve();location.href='index.html';return}
  else if(a==='fini'){mode=null;message=''}
  else if(a==='son'){S.musique=!S.musique;musique(S.musique)}
  else if(a==='deplacer'){mode={deplace:feuille.id};feuille=null;message='Touchez la case où le poser.'}
  else if(a==='acheter'){const prix=PRIX_EXT(S.ext);if(S.stock.pieces>=prix){S.stock.pieces-=prix;S.blocs.push(feuille.bloc);S.ext++;feuille=null;
    message='🌳 Le village s\'agrandit !';SON.pose();setTimeout(()=>etincelles(innerWidth/2,innerHeight/2),50)}}
  sauve();rendu();
}
function toucherCase(i,j){
  if(!mode){return}
  if(mode.chemins){const o=occupe(i,j);if(surPlace(i,j))return;
    if(o&&o.type==='chemin'){S.b=S.b.filter(x=>x!==o);S.stock.pieces+=BAT.chemin.cout.pieces;sauve();rendu();return}
    if(o)return;if(!assez(BAT.chemin.cout)){message='Il manque des pièces pour le chemin.';SON.non();rendu();return}
    paye(BAT.chemin.cout);S.b.push({id:uid(),type:'chemin',i,j});SON.pose();sauve();rendu();return}
  if(mode.pose){const k=mode.pose;if(!libre(k,i,j)){message='Pas la place ici : il faut des cases claires libres.';SON.non();rendu();return}
    if(!assez(BAT[k].cout)){message='Il manque de quoi le construire.';mode=null;rendu();return}
    paye(BAT[k].cout);const o={id:uid(),type:k,i,j,ep:epIdx()};if(BAT[k].sorte==='maison')o.depuis=Date.now();S.b.push(o);
    dernierPose=o.id;mode=null;message=`${BAT[k].e} ${BAT[k].nom} : c'est posé !`+(BAT[k].sorte==='deco'?'':' Reliez-le à la place par un chemin.');
    sauve();rendu();apresPose(o);return}
  if(mode.deplace){const o=S.b.find(x=>x.id===mode.deplace);if(!o){mode=null;rendu();return}
    if(!libre(o.type,i,j,o.id)){message='Pas la place ici.';SON.non();rendu();return}
    o.i=i;o.j=j;dernierPose=o.id;mode=null;message=`${BAT[o.type].e} Déplacé, sans rien payer.`;sauve();rendu();apresPose(o)}
}
function apresPose(o){SON.pose();const t=BAT[o.type].t,[x,y]=P(o.i+t/2,o.j+t);const [sx,sy]=versEcran(x,y);setTimeout(()=>poussiere(sx,sy-6),320)}
function toucherObjet(id,ev){
  const o=S.b.find(x=>x.id===id);if(!o)return;
  if(mode){if(mode.chemins&&o.type==='chemin'){toucherCase(o.i,o.j);return}if(mode.deplace||mode.pose)toucherCase(o.i,o.j);return}
  const ok=relies();
  if(pret(o,ok)){ramasser(o,ev);return}
  if(o.type==='chemin')return;
  feuille={quoi:'bat',id};rendu();
}
function ramasser(o,ev){
  const B=BAT[o.type],sx=ev.clientX||innerWidth/2,sy=ev.clientY||innerHeight/2;let gains=[];
  if(B.sorte==='maison'){const g=gainMaison(o);S.stock.pieces+=g;S.stock.etoiles+=1;o.depuis=Date.now();gains=[['pieces',g],['etoiles',1]]}
  else{const d=DUREES[o.duree||0],q=Math.ceil(d.q*mult(o)*(1+bonus(o)));S.stock[B.produit]=(S.stock[B.produit]||0)+q;S.stock.etoiles+=d.et;o.fin=null;o.duree=null;gains=[[B.produit,q],['etoiles',d.et]]}
  message='Ramassé : '+gains.map(([k,n])=>n+' '+RES[k].e).join(' et ')+(B.sorte==='atelier'?'. Touchez ▶ pour relancer.':'.');
  SON.ramasse();sauve();rendu();etincelles(sx,sy);gains.forEach(([k,n],m)=>setTimeout(()=>voler(sx,sy,k,n),m*160));
}
function caseFrise(id){const c=FRISE.find(x=>x.id===id);if(!c||S.frise.includes(id)||!assez(c.cout))return;
  const avant=FRISE.slice(0,FRISE.indexOf(c));if(!avant.every(x=>S.frise.includes(x.id)))return;
  paye(c.cout);S.frise.push(id);
  if(c.epoque){S.epoque=EPOQUES[c.epoque].id;feuille=null;fete=true;sauve();rendu();confettis();return}
  message=`${BAT[id].e} ${BAT[id].nom} est débloqué : il vous attend dans Construire.`;SON.lance();sauve();rendu()}
function lancer(id,n){const o=S.b.find(x=>x.id===id);if(!o)return;o.duree=n;o.fin=Date.now()+DUREES[n].min*60000;feuille=null;
  message=`${RES[BAT[o.type].produit].e} C'est parti : prêt vers ${heure(o.fin)}.`;SON.lance();sauve();rendu()}

/* Les parties de cartes versent leurs pièces dans la caisse (même tablette) ; elles rapportent aussi des étoiles. */
function encaisser(){
  let c=0;try{c=+(localStorage.getItem('village:caisse')||0)}catch{}
  if(c>0&&S){S.stock.pieces+=c;S.stock.etoiles+=Math.ceil(c/10);try{localStorage.setItem('village:caisse','0')}catch{}
    message=`🃏 Vos parties de cartes ont rapporté ${c} pièces et ${Math.ceil(c/10)} ⭐ !`;sauve()}
}
if(S)encaisser();
rendu();
document.addEventListener('pointerdown',premierGeste,{once:true});
// les bulles apparaissent toutes seules quand c'est prêt, et le soir tombe à l'heure de la tablette
let signe='';
setInterval(()=>{if(!S||feuille||mode||fete)return;const ok=relies(),s=S.b.map(o=>pret(o,ok)?1:0).join('')+nuit();if(s!==signe){signe=s;rendu()}},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S){encaisser();rendu()}});
</script>
<script src="habitants.js"></script><script src="saisons.js"></script>
</body>
</html>
