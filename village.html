<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le village de Mamie</title>
<meta name="theme-color" content="#2E5E3A">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* V3, étape 1 : le moteur (CONCEPTION-V3.md). Le squelette de Forge of Empires : un terrain en losanges qu'on agrandit,
   des bâtiments posés et déplacés librement, reliés par des chemins à la place, trois durées de production.
   Le plaisir du geste : sons, étincelles, pièces qui volent au compteur, rebond, jour et nuit, musique qu'on coupe. */
:root{
  --gold:#F0C04A; --gold-deep:#C99A22; --gold-ink:#2B1F00;
  --paper:#FBF5E6; --ink:#1E1A14; --ink-dim:#5A5145; --line:#D9CDB4;
  --f-display:"Libre Baskerville", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow-x:hidden}
body{margin:0;font-family:var(--f-body);font-size:22px;line-height:1.3;color:var(--ink);
  background:linear-gradient(180deg,#CFE8C2,#F4F8E8) fixed;transition:background 2s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.nuit{background:linear-gradient(180deg,#22314F,#3C4A63) fixed}
body.nuit .haut h1{color:#FFF3D6}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:28px;margin:0 8px 0 0}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px;min-height:44px;box-sizing:border-box}
.pill.gonfle{animation:gonfle .45s}
@keyframes gonfle{40%{transform:scale(1.3);background:#FFF1B8}}
.son{min-width:56px;min-height:48px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:26px}
.milieu{flex:1;display:flex;gap:14px;min-height:0;margin-top:8px}
.carte{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.carte svg{width:100%;height:100%;max-height:calc(100vh - 190px);touch-action:none;cursor:grab}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:10px;z-index:2}
.zoom .son{width:64px;height:64px;font-size:32px;font-weight:700}
.cote{width:290px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
@media (max-width:900px){.milieu{flex-direction:column}.cote{width:auto;flex:1}.carte{flex:0 0 auto;height:52vh}.carte svg{max-height:52vh}}
.aide{background:#FFF4CC;border:3px solid var(--gold);border-radius:18px;padding:10px 14px;font-size:20px;font-weight:700;line-height:1.35}
.msg{background:#FFFDF6;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;min-height:56px}
.bas{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-width:150px;font-size:24px;font-weight:700;min-height:76px;border-radius:18px;border:0;
  background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 var(--gold-deep);display:flex;align-items:center;justify-content:center;gap:10px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.big.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #B8B09C}
.big.vert{background:#7BB661;color:#fff;box-shadow:0 5px 0 #4E8A3A}
.big[disabled]{opacity:.45;cursor:default}
.big .e{font-size:30px}
.voile{position:fixed;inset:0;background:rgba(30,26,20,.35);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.feuille{background:var(--paper);border-radius:24px 24px 0 0;padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px));width:min(900px,100%);box-sizing:border-box;max-height:82vh;overflow:auto}
.feuille h2{font-family:var(--f-display);font-size:28px;margin:0 0 4px}
.feuille .sous{font-size:20px;color:var(--ink-dim);margin:0 0 14px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.choix{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px;font-weight:700;min-height:130px}
.choix .e{font-size:44px;line-height:1}
.choix small{font-weight:400;color:var(--ink-dim);font-size:16px;text-align:center}
.choix[disabled]{opacity:.45;cursor:default}
.vente{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vente .nom{flex:1;min-width:180px;font-size:21px}
.vente button{font-size:19px;font-weight:700;min-height:52px;padding:0 16px;border-radius:14px;border:2px solid var(--gold-deep);background:var(--gold)}
.vente button[disabled]{opacity:.4}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.actions .big{min-width:220px}
.fermer{float:right;font-size:20px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff}
.debut{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#CFE8C2,#F4F8E8);z-index:6;padding:16px;box-sizing:border-box}
.debut .boite{background:var(--paper);border-radius:24px;padding:28px;max-width:560px;text-align:center;border:2px solid var(--line)}
.champ{font-size:32px;font-weight:700;padding:12px 18px;border-radius:16px;border:4px solid var(--gold);width:100%;box-sizing:border-box;text-align:center;margin:14px 0;font-family:var(--f-body)}
/* Bulles, rebond, poussière, étincelles, vols */
.flotte{animation:flotte 1.6s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-7px)}}
.brille{animation:flotte 1.6s ease-in-out infinite, brille 1.2s ease-in-out infinite}
@keyframes brille{50%{filter:drop-shadow(0 0 8px #FFE27A) brightness(1.12)}}
.tombe{animation:tombe .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tombe{0%{transform:translateY(-70px) scaleY(1.1);opacity:0}60%{transform:translateY(4px) scaleY(.9);opacity:1}100%{transform:none}}
.porte{opacity:.55;animation:flotte 1s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.vol{position:fixed;font-size:34px;transition:transform .8s cubic-bezier(.5,-.3,.6,1), opacity .8s;will-change:transform}
.etin{position:fixed;width:10px;height:10px;border-radius:50%;background:#FFE27A;box-shadow:0 0 8px #FFD23F;animation:etin .7s ease-out forwards}
@keyframes etin{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.poussiere{position:fixed;width:26px;height:16px;border-radius:50%;background:rgba(200,180,140,.75);animation:pouss .7s ease-out forwards}
@keyframes pouss{to{transform:translate(var(--dx),-10px) scale(2.2);opacity:0}}
svg text{font-family:var(--f-body)}
</style>
</head>

/* ===================== La nature du terrain : arbres, rochers, buttes (25/10, Florian : « du bois […] et de la pierre

const POUSSE_H=3, SOUCHE_H=2;

const jourN=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
function semerNature(){if(S.nature)return;S.nature=[];const t=Date.now();
  for(let i=0;i<MONDE;i++)for(let j=0;j<MONDE;j++){if(surPlace(i,j)||occupe(i,j))continue;
    const r=hasard(i,j,7),mien=possede(i,j),n=1+Math.floor(hasard(i,j,8)*3);
    const t0=mien?(r<.02?'butte':r<.04?'rocher':r<.07?'arbre':null):(r<.05?'rocher':r<.07?'butte':null);

  const jours=Math.min(3,j-S.natureJour);if(jours<=0)return;S.natureJour=j;
  const libres=[];S.blocs.forEach(k=>{const [a,c]=k.split(',').map(Number);
    for(let i=a*BLOC;i<a*BLOC+BLOC;i++)for(let jj=c*BLOC;jj<c*BLOC+BLOC;jj++)if(!surPlace(i,jj)&&!occupe(i,jj)&&!natureA(i,jj))libres.push([i,jj])});
  let arbres=S.nature.filter(n=>possede(n.i,n.j)&&(n.t==='arbre'||n.t==='pousse')).length;const max=Math.max(4,Math.floor(libres.length*.06));
  for(let k=0;k<jours*2&&arbres<max&&libres.length;k++){const [i,jj]=libres.splice(Math.floor(Math.random()*libres.length),1)[0];

/* Les chemins : un bâtiment est relié si une case qui le borde est la place ou un chemin relié à la place. */
function relies(){
  const ok=new Set(), file=[];
  for(let a=0;a<2;a++)for(let c=0;c<2;c++){ok.add((PLACE.i+a)+','+(PLACE.j+c));file.push([PLACE.i+a,PLACE.j+c])}
  while(file.length){const [i,j]=file.shift();
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=(i+di)+','+(j+dj),o=occupe(i+di,j+dj);
      if(!ok.has(k)&&o&&o.type==='chemin'){ok.add(k);file.push([i+di,j+dj])}}}
  return ok;
}
function estRelie(o,ok){const t=BAT[o.type].t;
  for(let a=-1;a<=t;a++)for(let c=-1;c<=t;c++){if((a<0||a>=t)===(c<0||c>=t))continue;if(ok.has((o.i+a)+','+(o.j+c)))return true}
  return false}
// les décos sur l'anneau de cases qui borde un bâtiment
function autour(o){const t=BAT[o.type].t;let n=0;S.b.forEach(d=>{if(BAT[d.type].sorte!=='deco'||d===o)return;
  if(d.i>=o.i-1&&d.i<=o.i+t&&d.j>=o.j-1&&d.j<=o.j+t)n++});return n}
function bienArrange(){let txt='';S.b.forEach(o=>{const so=BAT[o.type].sorte;if(so==='deco'||so==='chemin'||o.orne||autour(o)<3)return;
  o.orne=1;S.stock.etoiles=(S.stock.etoiles||0)+2;txt=` ✨ ${BAT[o.type].nom} est joliment entouré : +2 ⭐.`});return txt}
function bonus(o){let b=0;S.b.forEach(d=>{const B=BAT[d.type];if(B.sorte!=='deco')return;
  const t=BAT[o.type].t;if(d.i>=o.i-2&&d.i<=o.i+t+1&&d.j>=o.j-2&&d.j<=o.j+t+1)b+=B.bonus});return Math.min(b,.6)}
function pret(o,ok){const B=BAT[o.type];if(!estRelie(o,ok))return false;
  if(B.sorte==='atelier')return o.fin!=null&&Date.now()>=o.fin;

  const ok=relies();let h='';const n=nuit(),sa=saisonVue();ANIME=0;

    const dans=i>=0&&j>=0&&i<MONDE&&j<MONDE,bk=Math.floor(i/BLOC)+','+Math.floor(j/BLOC),[cx,cy]=P(i+.5,j+.5),r=hasard(i,j,1);

}

  else if(a==='soeur-oublier'){couperLien();try{localStorage.removeItem(LIEN)}catch{}SOEUR.etat='seul';message='Le lien est oublié. Votre village reste tel quel.'}
  else if(a==='zoom-plus'){CAM.z=Math.min(2.2,CAM.z*1.3);rendu();return}
  else if(a==='zoom-moins'){CAM.z=Math.max(.45,CAM.z/1.3);rendu();return}

  else if(a==='poser'){poser();return}

function toucherCase(i,j){
  if(!mode){return}
  if(mode.chemins){const o=occupe(i,j);if(surPlace(i,j))return;
    if(natureA(i,j)){message='Il y a un arbre ou une pierre ici : touchez-le d\'abord pour le retirer.';SON.non();rendu();return}
    if(o&&o.type==='chemin'){S.b=S.b.filter(x=>x!==o);S.stock.pieces+=BAT.chemin.cout.pieces;sauve();rendu();return}
    if(o)return;if(!assez(BAT.chemin.cout)){message='Il manque des pièces pour le chemin.';SON.non();rendu();return}
    retire(BAT.chemin.cout);S.b.push({id:uid(),type:'chemin',i,j,s:mode.sorte||'terre',maj:Date.now(),par:S.nom});SON.pose();sauve();rendu();return}
  // pose ou déplacement : toucher une case y amène le fantôme (la case touchée sous son milieu) ; rien n'est posé
  const k=typeVise();if(!k)return;const t=BAT[k].t;mode.i=i-Math.floor(t/2);mode.j=j-Math.floor(t/2);majFantome();
}
function poser(){const k=typeVise();if(!k)return;const i=mode.i,j=mode.j;
  const gn=premiereGene();if(gn){message='';SON.non();const ai=$('.aide');if(ai){ai.textContent='❌ '+GENE[gn];ai.classList.remove('gonfle');void ai.offsetWidth;ai.classList.add('gonfle')}return}
  if(mode.pose){
    if(BAT[k].sorte==='nature'){if(!assez(BAT[k].cout)){message='Il manque de quoi le planter.';mode=null;rendu();return}
      retire(BAT[k].cout);const t=Date.now();S.nature=S.nature||[];S.nature.push({id:uid(),i,j,t:'pousse',depuis:t,maj:t,par:S.nom});mode=null;
      message=`🌱 Planté ! Ce sera un arbre vers ${heure(t+POUSSE_H*3600000)}.`;SON.pose();sauve();rendu();return}
    if(!assez(BAT[k].cout)){message='Il manque de quoi le construire.';mode=null;rendu();return}
    retire(BAT[k].cout);const o={id:uid(),type:k,i,j,ep:epIdx(),maj:Date.now(),par:S.nom};if(mode.r)o.r=1;if(BAT[k].sorte==='maison')o.depuis=Date.now()-(ici()&&ici().id==='maison'?3600000:0);S.b.push(o);
    dernierPose=o.id;mode=null;message=`${BAT[k].e} ${BAT[k].nom} : c'est posé !`+(BAT[k].sorte==='deco'?'':' Reliez-le à la place par un chemin.')+bienArrange();
    sauve();rendu();apresPose(o);return}
  if(mode.deplace){const o=S.b.find(x=>x.id===mode.deplace);if(!o){mode=null;rendu();return}
    o.i=i;o.j=j;o.r=mode.r?1:0;o.maj=Date.now();dernierPose=o.id;mode=mode.arranger?{arranger:true}:null;message=`${BAT[o.type].e} Déplacé, sans rien payer.`+bienArrange();sauve();rendu();apresPose(o)}
}
function apresPose(o){SON.pose();const t=BAT[o.type].t,[x,y]=P(o.i+t/2,o.j+t);const [sx,sy]=versEcran(x,y);setTimeout(()=>poussiere(sx,sy-6),320)}
function toucherObjet(id,ev){
  if(VISITE){fleurir(id,ev);return}
  const o=S.b.find(x=>x.id===id);if(!o)return;
  if(mode&&mode.arranger&&!mode.deplace){if(o.type!=='chemin'){mode={deplace:o.id,i:o.i,j:o.j,r:!!o.r,arranger:true};SON.tac();rendu()}return}
  if(mode){if(mode.chemins&&o.type==='chemin'){toucherCase(o.i,o.j);return}if(mode.deplace||mode.pose)toucherCase(o.i,o.j);return}

}
function ramasser(o,ev){
  const B=BAT[o.type],sx=ev.clientX||innerWidth/2,sy=ev.clientY||innerHeight/2;let gains=[];
  filSignal(B.sorte==='maison'?'pieces':o.type==='potager'?'recolte':'');

  o.maj=Date.now();

  SON.ramasse();sauve();rendu();etincelles(sx,sy);gains.forEach(([k,n],m)=>setTimeout(()=>voler(sx,sy,k,n),m*160));

function caseFrise(id){const c=FRISE.find(x=>x.id===id);if(!c||S.frise.includes(id)||!assez(c.cout))return;
  const avant=FRISE.slice(0,FRISE.indexOf(c));if(!avant.every(x=>S.frise.includes(x.id)))return;
  retire(c.cout);S.frise.push(id);
  if(c.epoque){S.epoque=EPOQUES[c.epoque].id;feuille=null;sauve();rendu();confettis();scenesEpoque(c.epoque);return}
  message=`${BAT[id].e} ${BAT[id].nom} est débloqué : il vous attend dans Construire.`;SON.lance();sauve();rendu()}
function lancer(id,n){const o=S.b.find(x=>x.id===id);if(!o)return;o.duree=n;o.maj=Date.now();o.fin=Date.now()+(ici()&&ici().id==='lancer'?60000:DUREES[n].min*60000);feuille=null;filSignal('lancer');
  message=`${RES[BAT[o.type].produit].e} C'est parti : prêt vers ${heure(o.fin)}.`;SON.lance();sauve();rendu()}

/* ===================== Deux villages (25/10, Florian : « elles font chacune leur village de leur côté ça fera une petite
   compétition de celle qui avance le plus vite », puis « deux villages ») =====
   Chaque tablette garde SON village, entier. La liaison est celle du rami (PeerJS, sans compte) ; reliées, chacune reçoit
   une copie du village de l'autre pour le visiter en lecture seule, peut fleurir un de ses bâtiments une fois par jour (comme
   l'aide de Forge of Empires), et le tableau des deux villages les compare. La dernière copie reçue reste gardée hors ligne. */
const SOEUR={peer:null,conn:null,etat:'seul'};
const lien=()=>{try{return JSON.parse(ls.get(LIEN)||'null')}catch{return null}};
const clone=x=>JSON.parse(JSON.stringify(x));
// ce que l'autre reçoit : de quoi dessiner mon village, et le résumé du tableau
const copieVillage=()=>({b:S.b,nature:S.nature||[],blocs:S.blocs,ext:S.ext,epoque:S.epoque,frise:S.frise,monument:S.monument||null,saison:S.saison||null});
const resume=()=>({nom:S.nom,epoque:S.epoque,bats:S.b.filter(o=>BAT[o.type].sorte!=='chemin').length,etoiles:S.stock.etoiles||0,
  monument:(S.monument&&S.monument.niveau)||0,coeurs:Object.values((S.habitants&&S.habitants.coeurs)||{}).reduce((a,b)=>a+(+b||0),0)});
const ID_SOEUR=c=>'villagemamie51-'+c;
function majSoeur(){if(!glisse&&(!feuille||feuille.quoi==='soeur')&&!mode&&!fete)rendu()}
function chargerPeer(suite){if(window.Peer)return suite();const sc=document.createElement('script');sc.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  sc.onload=suite;sc.onerror=()=>{sc.remove();SOEUR.etat='hors';majSoeur();setTimeout(()=>{if(lien())chargerPeer(suite)},20000)};document.head.appendChild(sc)}
function couperLien(){const c=SOEUR.conn,p=SOEUR.peer;SOEUR.conn=null;SOEUR.peer=null;try{c&&c.close()}catch{}try{p&&p.destroy()}catch{}}
function lancerLien(){const L=lien();if(!L)return;couperLien();SOEUR.etat='seul';majSoeur();chargerPeer(()=>{const M=lien();if(M)(M.role==='hote'?hote:invite)(M.code)})}
function surErreur(p,e){if(SOEUR.peer!==p)return;
  if(['network','server-error','socket-error','socket-closed','browser-incompatible'].includes(e.type)){SOEUR.etat='hors';majSoeur();setTimeout(()=>{if(SOEUR.peer===p)lancerLien()},15000)}}
function hote(code){const p=new Peer(ID_SOEUR(code),{debug:0});SOEUR.peer=p;
  p.on('open',()=>{if(SOEUR.etat!=='ensemble')SOEUR.etat='attente';majSoeur()});
  p.on('connection',c=>{if(SOEUR.conn&&SOEUR.conn!==c){try{SOEUR.conn.close()}catch{}}brancher(c)});
  p.on('error',e=>{if(e.type==='unavailable-id'){try{p.destroy()}catch{}if(SOEUR.peer===p)SOEUR.peer=null;setTimeout(()=>{if(lien()&&!SOEUR.peer)hote(code)},5000);return}surErreur(p,e)});
  p.on('disconnected',()=>setTimeout(()=>{if(SOEUR.peer===p&&!p.destroyed)try{p.reconnect()}catch{}},2000))}
function invite(code){const p=new Peer({debug:0});SOEUR.peer=p;
  p.on('open',()=>joindre(code));
  p.on('error',e=>{if(e.type==='peer-unavailable'){SOEUR.etat='attente';majSoeur();setTimeout(()=>joindre(code),6000);return}surErreur(p,e)});
  p.on('disconnected',()=>setTimeout(()=>{if(SOEUR.peer===p&&!p.destroyed)try{p.reconnect()}catch{}},2000))}
function joindre(code){const p=SOEUR.peer;if(!p||p.destroyed||(SOEUR.conn&&SOEUR.conn.open))return;
  const c=p.connect(ID_SOEUR(code),{reliable:true});brancher(c);setTimeout(()=>{if(SOEUR.conn===c&&!c.open){try{c.close()}catch{}joindre(code)}},9000)}
function brancher(c){SOEUR.conn=c;
  c.on('open',()=>{SOEUR.etat='ensemble';envoyerSoeur();majSoeur()});
  c.on('data',recevoir);
  c.on('close',()=>{if(SOEUR.conn!==c)return;SOEUR.conn=null;SOEUR.etat='attente';majSoeur();const L=lien();if(L&&L.role==='invite')setTimeout(()=>joindre(L.code),4000)})}
window.envoyerSoeur=function(){const c=SOEUR.conn;if(S&&!MOI&&c&&c.open)try{c.send({t:'village',v:copieVillage(),r:resume(),nom:S.nom,fleur:S.fleurDonnee||null})}catch{}};
function recevoir(m){if(!m||m.t!=='village'||!S||!m.v)return;
  S.soeur=m.nom;S.voisine={nom:m.nom,v:m.v,r:m.r||null,maj:Date.now()};
  // sa fleur du jour, posée sur un de mes bâtiments : un bonus de production jusqu'au lendemain
  const f=m.fleur;if(f&&f.jour>=jourN()-1&&S.fleurRecue!==f.jour){const o=S.b.find(x=>x.id===f.id);S.fleurRecue=f.jour;
    if(o){S.fleuris=S.fleuris||{};S.fleuris[o.id]=Date.now()+24*3600000;message=`🌸 ${esc(m.nom)} a fleuri votre ${BAT[o.type].nom} : +50 % de production jusqu'à demain.`;
      try{SON.ramasse()}catch{}}}
  sauveIci();majSoeur()}
/* La visite : le village de l'autre se dessine à la place du mien, le temps du rendu (S est échangé puis rendu) ;
   rien ne s'y pose ni ne s'y ramasse, rien n'est sauvegardé pendant l'échange. */
function villageVisite(moi){const v=moi.voisine.v,c=clone(moi);
  return Object.assign(c,{nom:moi.voisine.nom,b:clone(v.b||[]),nature:clone(v.nature||[]),blocs:clone(v.blocs||['4,4']),ext:v.ext||0,epoque:v.epoque||'hameau',
    frise:clone(v.frise||[]),monument:v.monument?clone(v.monument):c.monument,saison:v.saison?clone(v.saison):c.saison})}
const fleurie=o=>MOI?!!(MOI.fleurDonnee&&MOI.fleurDonnee.id===o.id&&MOI.fleurDonnee.jour===jourN()):!!(S.fleuris&&S.fleuris[o.id]>Date.now());
function fleurir(id,ev){const v=S.voisine&&S.voisine.v,o=v&&(v.b||[]).find(x=>x.id===id);if(!o||BAT[o.type].sorte==='chemin')return;
  if(S.fleurDonnee&&S.fleurDonnee.jour===jourN()){message=S.fleurDonnee.id===id?`🌸 Celui-ci est déjà fleuri aujourd'hui.`:`🌸 Vous avez déjà fleuri un bâtiment aujourd'hui. Revenez demain !`;SON.non();rendu();return}
