<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le village de Mamie</title>
<meta name="theme-color" content="#2E5E3A">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap">
<style>
/* V3, étape 1 : le moteur (CONCEPTION-V3.md). Le squelette de Forge of Empires : un terrain en losanges qu'on agrandit,
   des bâtiments posés et déplacés librement, reliés par des chemins à la place, trois durées de production.
   Le plaisir du geste : sons, étincelles, pièces qui volent au compteur, rebond, jour et nuit, musique qu'on coupe. */
:root{
  --gold:#F0C04A; --gold-deep:#C99A22; --gold-ink:#2B1F00;
  --paper:#FBF5E6; --ink:#1E1A14; --ink-dim:#5A5145; --line:#D9CDB4;
  --f-display:"Libre Baskerville", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow-x:hidden}
body{margin:0;font-family:var(--f-body);font-size:22px;line-height:1.3;color:var(--ink);
  background:linear-gradient(180deg,#CFE8C2,#F4F8E8) fixed;transition:background 2s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.nuit{background:linear-gradient(180deg,#22314F,#3C4A63) fixed}
body.nuit .haut h1{color:#FFF3D6}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:28px;margin:0 8px 0 0}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px;min-height:44px;box-sizing:border-box}
.pill.gonfle{animation:gonfle .45s}
@keyframes gonfle{40%{transform:scale(1.3);background:#FFF1B8}}
.son{min-width:56px;min-height:48px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:26px}
.milieu{flex:1;display:flex;gap:14px;min-height:0;margin-top:8px}
.carte{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.carte svg{width:100%;height:100%;max-height:calc(100vh - 190px);touch-action:none;cursor:grab}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:10px;z-index:2}
.zoom .son{width:64px;height:64px;font-size:32px;font-weight:700}
.cote{width:290px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
@media (max-width:900px){.milieu{flex-direction:column}.cote{width:auto;flex:1}.carte{flex:0 0 auto;height:52vh}.carte svg{max-height:52vh}}
.aide{background:#FFF4CC;border:3px solid var(--gold);border-radius:18px;padding:10px 14px;font-size:20px;font-weight:700;line-height:1.35}
.msg{background:#FFFDF6;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;min-height:56px}
.bas{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-width:150px;font-size:24px;font-weight:700;min-height:76px;border-radius:18px;border:0;
  background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 var(--gold-deep);display:flex;align-items:center;justify-content:center;gap:10px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.big.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #B8B09C}
.big.vert{background:#7BB661;color:#fff;box-shadow:0 5px 0 #4E8A3A}
.big[disabled]{opacity:.45;cursor:default}
.big .e{font-size:30px}
.voile{position:fixed;inset:0;background:rgba(30,26,20,.35);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.feuille{background:var(--paper);border-radius:24px 24px 0 0;padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px));width:min(900px,100%);box-sizing:border-box;max-height:82vh;overflow:auto}
.feuille h2{font-family:var(--f-display);font-size:28px;margin:0 0 4px}
.feuille .sous{font-size:20px;color:var(--ink-dim);margin:0 0 14px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.choix{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px;font-weight:700;min-height:130px}
.choix .e{font-size:44px;line-height:1}
.choix small{font-weight:400;color:var(--ink-dim);font-size:16px;text-align:center}
.choix[disabled]{opacity:.45;cursor:default}
.vente{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vente .nom{flex:1;min-width:180px;font-size:21px}
.vente button{font-size:19px;font-weight:700;min-height:52px;padding:0 16px;border-radius:14px;border:2px solid var(--gold-deep);background:var(--gold)}
.vente button[disabled]{opacity:.4}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.actions .big{min-width:220px}
.fermer{float:right;font-size:20px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff}
.debut{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#CFE8C2,#F4F8E8);z-index:6;padding:16px;box-sizing:border-box}
.debut .boite{background:var(--paper);border-radius:24px;padding:28px;max-width:560px;text-align:center;border:2px solid var(--line)}
.champ{font-size:32px;font-weight:700;padding:12px 18px;border-radius:16px;border:4px solid var(--gold);width:100%;box-sizing:border-box;text-align:center;margin:14px 0;font-family:var(--f-body)}
/* Bulles, rebond, poussière, étincelles, vols */
.flotte{animation:flotte 1.6s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-7px)}}
.brille{animation:flotte 1.6s ease-in-out infinite, brille 1.2s ease-in-out infinite}
@keyframes brille{50%{filter:drop-shadow(0 0 8px #FFE27A) brightness(1.12)}}
.tombe{animation:tombe .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tombe{0%{transform:translateY(-70px) scaleY(1.1);opacity:0}60%{transform:translateY(4px) scaleY(.9);opacity:1}100%{transform:none}}
.porte{opacity:.55;animation:flotte 1s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.vol{position:fixed;font-size:34px;transition:transform .8s cubic-bezier(.5,-.3,.6,1), opacity .8s;will-change:transform}
.etin{position:fixed;width:10px;height:10px;border-radius:50%;background:#FFE27A;box-shadow:0 0 8px #FFD23F;animation:etin .7s ease-out forwards}
@keyframes etin{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.poussiere{position:fixed;width:26px;height:16px;border-radius:50%;background:rgba(200,180,140,.75);animation:pouss .7s ease-out forwards}
@keyframes pouss{to{transform:translate(var(--dx),-10px) scale(2.2);opacity:0}}
svg text{font-family:var(--f-body)}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
/* ===================== Données : l'époque Hameau, six bâtiments ===================== */
const RES={pieces:{e:'🪙',nom:'pièces'},etoiles:{e:'⭐',nom:'étoiles'},legumes:{e:'🥕',nom:'légumes',vend:2},bois:{e:'🪵',nom:'bois',vend:2},oeufs:{e:'🥚',nom:'œufs',vend:3},
 fleurs:{e:'💐',nom:'bouquets',vend:4},fruits:{e:'🍎',nom:'fruits',vend:4},farine:{e:'🌾',nom:'farine',vend:5},pain:{e:'🍞',nom:'pains',vend:8},outils:{e:'🔧',nom:'outils',vend:10},pierre:{e:'🪨',nom:'pierre',vend:3}};
/* sorte : maison (pièces chaque heure), atelier (3 durées), deco (bonus autour), chemin */
const BAT={
 maison:{nom:'Maison de bois',e:'🏠',sorte:'maison',t:2,cout:{pieces:60},parHeure:10,aide:'Donne des pièces chaque heure ; la réserve tient 3 jours.'},
 potager:{nom:'Potager',e:'🥕',sorte:'atelier',t:2,cout:{pieces:40},produit:'legumes',aide:'Des légumes, en 5 minutes, 1 heure ou 8 heures.'},
 bucheron:{nom:'Cabane du bûcheron',e:'🪓',sorte:'atelier',t:2,cout:{pieces:70},produit:'bois',mur:'#B07A4A',toit:'#6B4A2E',aide:'Du bois pour construire.'},
 poulailler:{nom:'Poulailler',e:'🐔',sorte:'atelier',t:2,cout:{pieces:90,bois:10},produit:'oeufs',mur:'#F2E3C4',toit:'#B5523A',aide:'Des œufs, qui se vendent bien.'},
 puits:{nom:'Puits',e:'🪣',sorte:'deco',t:1,cout:{pieces:80,bois:15},bonus:.2,aide:'Les bâtiments tout autour produisent 20 % de plus.'},
 massif:{nom:'Massif de fleurs',e:'🌷',sorte:'deco',t:1,cout:{pieces:30,legumes:5},bonus:.1,aide:'Les bâtiments tout autour produisent 10 % de plus.'},
 chemin:{nom:'Chemin',e:'🟫',sorte:'chemin',t:1,cout:{pieces:2},aide:'Relie les bâtiments à la place du village.'},
 arbre:{nom:'Jeune arbre',e:'🌱',sorte:'nature',t:1,cout:{pieces:5},aide:'Une jeune pousse, qui devient un arbre à couper en 3 heures.'},
 // époque Village
 boulangerie:{nom:"Boulangerie d'Hugo",e:'🥖',sorte:'atelier',t:2,ep:1,cout:{pieces:200,bois:30},produit:'pain',mur:'#F6DDB2',toit:'#B5651D',aide:'Hugo fait du pain.'},
 fleuriste:{nom:'Fleurs de Chloé',e:'💐',sorte:'atelier',t:2,ep:1,cout:{pieces:180,legumes:20},produit:'fleurs',mur:'#FADDE6',toit:'#C2457A',aide:'Chloé compose des bouquets.'},
 verger:{nom:'Verger',e:'🍎',sorte:'atelier',t:2,ep:1,cout:{pieces:150,bois:20},produit:'fruits',aide:'Des pommes et des poires.'},
 moulin:{nom:'Moulin',e:'🌾',sorte:'atelier',t:2,ep:1,cout:{pieces:250,bois:50},produit:'farine',mur:'#EFE6D2',toit:'#8D6E4F',aide:'De la farine pour le village.'},
 // époque Bourg
 marche:{nom:'Marché couvert',e:'🏪',sorte:'maison',t:2,ep:2,cout:{pieces:600,pain:15,pierre:30},parHeure:40,mur:'#E8D9B5',toit:'#C0392B',aide:'Des pièces chaque heure, bien plus qu\'une maison.'},
 atelier:{nom:'Atelier de Pierre',e:'🔧',sorte:'atelier',t:2,ep:2,cout:{pieces:500,bois:80,oeufs:30,pierre:20},produit:'outils',mur:'#DADAD2',toit:'#55534C',aide:'Pierre fabrique des outils.'},
 fontaine:{nom:'Fontaine',e:'⛲',sorte:'deco',t:1,ep:2,cout:{pieces:400,farine:20,pierre:20},bonus:.3,aide:'Les bâtiments tout autour produisent 30 % de plus.'},
 // époque Ville fleurie
 mairie:{nom:'Mairie',e:'🏛️',sorte:'maison',t:2,ep:3,cout:{pieces:1500,outils:20,pierre:60},parHeure:80,mur:'#E9EEF5',toit:'#3A6EA5',aide:'La fierté du village : beaucoup de pièces chaque heure.'},
 kiosque:{nom:'Kiosque à musique',e:'🎶',sorte:'deco',t:1,ep:3,cout:{pieces:900,fleurs:40,pierre:20},bonus:.4,aide:'Les bâtiments tout autour produisent 40 % de plus.'},
 serre:{nom:'Serre',e:'🌿',sorte:'atelier',t:2,ep:3,cout:{pieces:1000,fruits:40},produit:'fleurs',mult:2,mur:'#CFE8EE',toit:'#9FC9D3',aide:'Deux fois plus de bouquets.'}};
Object.values(BAT).forEach(B=>{B.ep=B.ep||0});
/* Les époques de Forge of Empires : la frise se parcourt dans l'ordre ; une case « époque » fait monter tout le village. */
const EPOQUES=[
 {id:'hameau',nom:'Hameau',chemin:['#E2CF9E','#C9B47F'],place:'#D9D2C0'},
 {id:'village',nom:'Village',chemin:['#D8B98A','#B9986A'],place:'#D6C3A0',phrase:'Chloé : « Des toits de chaume partout ! Je vais enfin pouvoir ouvrir ma boutique. »'},
 {id:'bourg',nom:'Bourg',chemin:['#C9C4BA','#9E978A'],place:'#BDB8AE',phrase:'Chloé : « Des pavés et une vraie place ! Pierre installe son atelier. »'},
 {id:'ville',nom:'Ville fleurie',chemin:['#E3BDB2','#C29A8E'],place:'#E8D2C8',phrase:'Chloé : « Que de fleurs ! On dirait une carte postale. »'}];
const FRISE=[
 {id:'ep-village',epoque:1,cout:{etoiles:15,pieces:150}},
 {id:'boulangerie',cout:{etoiles:10,pieces:100}},{id:'fleuriste',cout:{etoiles:10,pieces:100}},{id:'verger',cout:{etoiles:8,pieces:80}},{id:'moulin',cout:{etoiles:12,pieces:120}},
 {id:'ep-bourg',epoque:2,cout:{etoiles:60,pieces:800,pain:10}},
 {id:'marche',cout:{etoiles:25,pieces:300}},{id:'atelier',cout:{etoiles:25,pieces:300}},{id:'fontaine',cout:{etoiles:20,pieces:200}},
 {id:'ep-ville',epoque:3,cout:{etoiles:150,pieces:2500,outils:20}},
 {id:'mairie',cout:{etoiles:50,pieces:800}},{id:'kiosque',cout:{etoiles:40,pieces:600}},{id:'serre',cout:{etoiles:40,pieces:600}}];
const epIdx=()=>Math.max(0,EPOQUES.findIndex(e=>e.id===S.epoque));
const debloque=k=>BAT[k].ep===0||S.frise.includes(k);
const mult=o=>(1+.5*(o.ep||0))*(BAT[o.type].mult||1)*(1+(window.BONUS_MONUMENT||0));   // le monument (saisons.js) : +5 % par niveau
const coutMonter=o=>({pieces:60*((o.ep||0)+1)*BAT[o.type].t*BAT[o.type].t});
/* Images d'époque : img/v3/<type>-<époque>.webp si elle existe ; sinon une image plus ancienne ; sinon le dessin. */
const IMGS={}, ANCIENNES={maison:'maison-1',boulangerie:'boulangerie',fleuriste:'fleuriste',atelier:'garage',mairie:'mairie'};
let attenteImg=null;
// La liste des images réellement déposées dans img/v3 (remplie à l'assemblage) : aucune requête à l'aveugle, aucune erreur 404.
const IMAGES_V3=["atelier-bourg", "boulangerie-village", "bucheron-bourg", "bucheron-hameau", "bucheron-village", "bucheron-ville", "fleuriste-village", "fontaine-bourg", "kiosque-ville", "maison-bourg", "maison-hameau", "maison-village", "maison-ville", "marche-bourg", "massif-bourg", "massif-hameau", "massif-village", "massif-ville", "poulailler-bourg", "poulailler-hameau", "poulailler-village", "poulailler-ville", "puits-bourg", "puits-hameau", "puits-village", "puits-ville", "serre-ville"];
/* Calage mesuré sur chaque image : [x gauche, y gauche, x droite, y droite, largeur, hauteur] de la face du dessus de son bloc.
   Cette face tombe pile sur le losange de l'emprise ; le reste est coupé en prisme (voir imageCalee). */
const CALAGE={"v3/atelier-bourg":[0,203,400,203,400,303],"v3/boulangerie-village":[0,187,400,187,400,287],"v3/bucheron-bourg":[0,185,400,185,400,285],"v3/bucheron-hameau":[0,184,400,184,400,284],"v3/bucheron-village":[0,191,400,191,400,291],"v3/bucheron-ville":[0,194,400,194,400,294],"v3/fleuriste-village":[0,193,400,193,400,293],"v3/fontaine-bourg":[0,184,400,184,400,284],"v3/kiosque-ville":[0,182,400,182,400,282],"v3/maison-bourg":[0,205,400,205,400,305],"v3/maison-hameau":[0,190,400,190,400,290],"v3/maison-village":[0,188,400,188,400,288],"v3/maison-ville":[0,195,400,195,400,295],"v3/marche-bourg":[0,189,400,189,400,289],"v3/massif-bourg":[0,160,400,160,400,260],"v3/massif-hameau":[0,162,400,162,400,262],"v3/massif-village":[0,172,400,172,400,272],"v3/massif-ville":[0,189,400,189,400,289],"v3/poulailler-bourg":[0,192,400,192,400,292],"v3/poulailler-hameau":[0,190,400,190,400,290],"v3/poulailler-village":[0,196,400,196,400,296],"v3/poulailler-ville":[0,192,400,192,400,292],"v3/puits-bourg":[0,172,400,172,400,272],"v3/puits-hameau":[0,168,400,168,400,268],"v3/puits-village":[0,192,400,192,400,292],"v3/puits-ville":[0,177,400,177,400,277],"v3/serre-ville":[0,197,400,197,400,297],"maison-1":[0,199,399,186,400,391],"mairie":[0,145,385,150,386,400],"garage":[0,201,382,210,383,400],"fleuriste":[0,217,386,209,387,400],"boulangerie":[0,188,393,188,394,400]};
IMAGES_V3.forEach(cle=>{const im=new Image();
  im.onload=()=>{IMGS[cle]=true;clearTimeout(attenteImg);attenteImg=setTimeout(()=>{if(S&&!feuille)rendu()},300)};im.src='img/v3/'+cle+'.webp'});
function imageDe(o){for(let e=o.ep||0;e>=0;e--){const cle=o.type+'-'+EPOQUES[e].id;if(IMGS[cle])return 'v3/'+cle}return ANCIENNES[o.type]||null}
const DUREES=[{min:5,nom:'Petit',q:3,et:1},{min:60,nom:'Moyen',q:12,et:3},{min:480,nom:'Gros, pour la nuit',q:40,et:8}];
const MONDE=40, BLOC=4;                         // 40 × 40 cases (25/10, Florian : « que la carte soit assez grande »), en blocs de 4 × 4 ; on part des 4 blocs du centre
const PLACE={i:19,j:19};                          // la place du village, 2 × 2, fixe : c'est là que mènent les chemins
const PRIX_EXT=n=>100+40*n;                     // un prix qui reste doux, même au vingtième morceau

/* ===================== Mémoire de la tablette ===================== */
const PROFIL=(new URLSearchParams(location.search).get('profil')||'').replace(/[^a-z0-9]/gi,'');
const CLE='village3'+(PROFIL?'-'+PROFIL:'')+':etat', NOM='rami'+(PROFIL?'-'+PROFIL:'')+':nom', LIEN='village3'+(PROFIL?'-'+PROFIL:'')+':lien';
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const uid=()=>Math.random().toString(36).slice(2,9);
function neuf(nom){
  const t=Date.now(), b=[];
  const pose=(type,i,j,extra)=>b.push(Object.assign({id:uid(),type,i,j},extra||{}));
  pose('maison',16,18,{depuis:t-75*60000});
  pose('potager',22,18,{fin:t-1000,duree:0});           // une première récolte prête : la première visite a déjà de quoi ramasser
  pose('massif',21,21);
  [[18,18],[18,19],[21,18],[21,19]].forEach(([i,j])=>pose('chemin',i,j));
  b.forEach(o=>{o.maj=t;o.par=nom});
  return {v:3,monde:40,nom,blocs:['4,4','4,5','5,4','5,5'],ext:0,b,
    stock:{pieces:150,etoiles:0,legumes:0,bois:10,oeufs:0},musique:true,epoque:'hameau',frise:[]};
}
let S=null;
try{S=JSON.parse(ls.get(CLE))}catch{}
if(S&&S.v!==3)S=null;
if(S&&!S.epoque)S.epoque='hameau';
if(S&&!S.frise)S.frise=[];
if(S&&!S.monde){S.blocs=S.blocs.map(k=>{const [a,c]=k.split(',').map(Number);return (a+3)+','+(c+3)});S.b.forEach(o=>{o.i+=12;o.j+=12});S.monde=40}   // contrat lu par habitants.js et saisons.js : 'hameau' | 'village' | 'bourg' | 'ville'
function sauve(){ls.set(CLE,JSON.stringify(S));if(window.envoyerSoeur)envoyerSoeur()}   // la sœur reçoit aussitôt, si elle est là
function sauveIci(){ls.set(CLE,JSON.stringify(S))}

/* ===================== Outils ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let message='', feuille=null, mode=null, dernierPose=null, fete=false;   // mode : {pose:type,i,j} | {deplace:id,i,j} | {chemins:true} ; i,j : où se tient le fantôme
const assez=c=>Object.entries(c).every(([k,v])=>(S.stock[k]||0)>=v);
const retire=c=>Object.entries(c).forEach(([k,v])=>S.stock[k]-=v);   // retire du stock ce que coûte un geste du jeu
const txt=c=>Object.entries(c).map(([k,v])=>`<span class="cout"><i class="case">${RES[k].e}</i>${v}</span>`).join(' ');   // les coûts, comme un inventaire
const heure=ms=>{const d=new Date(ms);return d.getHours()+' h '+String(d.getMinutes()).padStart(2,'0')};
const possede=(i,j)=>i>=0&&j>=0&&i<MONDE&&j<MONDE&&S.blocs.includes(Math.floor(i/BLOC)+','+Math.floor(j/BLOC));
const surPlace=(i,j)=>i>=PLACE.i&&i<PLACE.i+2&&j>=PLACE.j&&j<PLACE.j+2;
const occupe=(i,j,sauf)=>S.b.find(o=>o.id!==sauf&&i>=o.i&&i<o.i+BAT[o.type].t&&j>=o.j&&j<o.j+BAT[o.type].t);
function libre(type,i,j,sauf){const t=BAT[type].t;for(let a=0;a<t;a++)for(let c=0;c<t;c++){
  if(!possede(i+a,j+c)||surPlace(i+a,j+c)||occupe(i+a,j+c,sauf)||natureA(i+a,j+c))return false}return true}
/* La pose avec aperçu (25/10, Florian : « que quand je pose mon batiment je vois direct la place qu'il prend ») :
   le bâtiment choisi apparaît en fantôme sur la carte, ses cases en vert si la place est bonne, en rouge sinon ;
   on le glisse du doigt, et rien n'est posé avant « Poser ici ». */
function gene(i,j,sauf){if(!possede(i,j))return 'hors';if(surPlace(i,j))return 'place';if(occupe(i,j,sauf))return 'occupe';const n=natureA(i,j);return n?stade(n):''}
const GENE={hors:'Ce terrain n\'est pas encore à vous : le + l\'agrandit.',place:'C\'est la place du village : elle reste libre.',occupe:'Il y a déjà un bâtiment ici.',
  arbre:'Un arbre gêne : coupez-le d\'abord (Annuler, puis touchez l\'arbre).',pousse:'Une jeune pousse gêne.',souche:'Une souche gêne : un toucher l\'enlève.',
  rocher:'Un rocher gêne : minez-le d\'abord (Annuler, puis touchez le rocher).',butte:'Une butte gêne : creusez-la d\'abord (Annuler, puis touchez-la).'};
const typeVise=()=>mode&&(mode.pose||(mode.deplace&&(S.b.find(o=>o.id===mode.deplace)||{}).type));
// la première place libre près du centre de la vue, pour que le fantôme apparaisse sous les yeux
function viserPres(type,sauf){const t=BAT[type].t,ci=Math.round(CAM.i-t/2),cj=Math.round(CAM.j-t/2);
  for(let r=0;r<7;r++)for(let a=-r;a<=r;a++)for(let c=-r;c<=r;c++){if(Math.max(Math.abs(a),Math.abs(c))===r&&libre(type,ci+a,cj+c,sauf))return [ci+a,cj+c]}
  return [ci,cj]}
function premiereGene(){const k=typeVise(),t=BAT[k].t;for(let a=0;a<t;a++)for(let c=0;c<t;c++){const g=gene(mode.i+a,mode.j+c,mode.deplace);if(g)return g}return ''}
function dessinFantome(){const k=typeVise();if(!k)return '';const t=BAT[k].t,sauf=mode.deplace;let h='';
  if(mode.deplace){const o=S.b.find(x=>x.id===sauf);if(o&&(o.i!==mode.i||o.j!==mode.j))h+=poly(los(o.i,o.j,t),'rgba(255,248,225,.25)','#FFF8E1','stroke-width="2.5" stroke-dasharray="7 5"')}
  // les cases colorées passent par-dessus le fantôme (l'image a son propre sol, qui les cacherait)
  let marques='';
  for(let a=0;a<t;a++)for(let c=0;c<t;c++){const g=gene(mode.i+a,mode.j+c,sauf);
    marques+=poly(los(mode.i+a,mode.j+c),g?'rgba(229,57,53,.45)':'rgba(76,175,80,.42)',g?'#B71C1C':'#1B5E20','stroke-width="2.5"');
  }
  for(let a=0;a<t;a++)for(let c=0;c<t;c++){const g=gene(mode.i+a,mode.j+c,sauf);
    if(g){const [x,y]=P(mode.i+a+.5,mode.j+c+.5);marques+=`<g><circle cx="${x}" cy="${y}" r="9" fill="#B71C1C" stroke="#fff" stroke-width="2"/><path d="M${x-4} ${y-4}l8 8M${x+4} ${y-4}l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>`}}
  const o={id:'fantome',type:k,i:mode.i,j:mode.j,ep:sauf?(S.b.find(x=>x.id===sauf)||{}).ep||0:epIdx()};
  const corps=BAT[k].sorte==='nature'?imageCase('decor-pousse',mode.i,mode.j):dessinObjet(o,null,true);
  return h+`<g opacity=".75">${corps}</g>`+marques}
function majFantome(){const g=document.getElementById('fantome-boite');if(!g)return;g.innerHTML=dessinFantome();
  const gn=premiereGene(),ok=$('.valide [data-a="poser"]'),ai=$('.aide');
  if(ok)ok.classList.toggle('gris',!!gn);
  if(ai)ai.textContent=gn?'❌ '+GENE[gn]:'✅ La place est bonne. Glissez-le pour le changer de place, puis « Poser ici ».';
  placerValide()}
// les boutons ✔ et ✖ se tiennent juste sous le fantôme, sans jamais sortir de l'écran
function placerValide(){const v=$('.valide');if(!v||!typeVise())return;const t=BAT[typeVise()].t,[x,y]=P(mode.i+t,mode.j+t),[sx,sy]=versEcran(x,y);
  const w=v.offsetWidth||300,hh=v.offsetHeight||64;
  v.style.left=Math.max(8,Math.min(innerWidth-w-8,sx-w/2))+'px';v.style.top=Math.max(150,Math.min(innerHeight-hh-90,sy+16))+'px'}
function versCarte(sx,sy){const svg=$('.carte svg'),p=svg.createSVGPoint();p.x=sx;p.y=sy;const q=p.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y]}

/* ===================== La nature du terrain : arbres, rochers, buttes (25/10, Florian : « du bois […] et de la pierre
   qu'on peut miner ou creuser pour applanir ») =====
   Un arbre pousse seul de temps en temps sur une case libre (jamais au point d'étouffer le village), ou se plante ; un
   toucher le coupe (du bois, puis une souche qui s'en va seule). Un rocher se mine en 1 à 3 touchers, une butte se creuse
   d'un toucher : de la pierre, et la case redevient constructible. Rien ne bloque une case pour toujours. */
const POUSSE_H=3, SOUCHE_H=2;
const HAUT_NATURE={"decor-arbre-1": 442, "decor-arbre-2": 509, "decor-pousse": 304, "decor-souche": 252, "decor-rocher-petit": 200, "decor-rocher-gros": 387, "decor-butte": 244};   // hauteur des images de la session Images, calées sur une case (largeur 400 = le losange)
const natureA=(i,j)=>(S.nature||[]).find(n=>n.i===i&&n.j===j);
const stade=n=>n.t==='pousse'&&Date.now()-n.depuis>=POUSSE_H*3600000?'arbre':n.t;
const jourN=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
function semerNature(){if(S.nature)return;S.nature=[];const t=Date.now();
  for(let i=0;i<MONDE;i++)for(let j=0;j<MONDE;j++){if(surPlace(i,j)||occupe(i,j))continue;
    const r=hasard(i,j,7),mien=possede(i,j),n=1+Math.floor(hasard(i,j,8)*3);
    const t0=mien?(r<.02?'butte':r<.04?'rocher':r<.07?'arbre':null):(r<.05?'rocher':r<.07?'butte':null);
    if(t0)S.nature.push({id:uid(),i,j,t:t0,n,depuis:t,maj:t})}
  S.natureJour=jourN()}
function pousserArbres(){const j=jourN();if(!S.natureJour){S.natureJour=j;return}
  const jours=Math.min(3,j-S.natureJour);if(jours<=0)return;S.natureJour=j;
  const libres=[];S.blocs.forEach(k=>{const [a,c]=k.split(',').map(Number);
    for(let i=a*BLOC;i<a*BLOC+BLOC;i++)for(let jj=c*BLOC;jj<c*BLOC+BLOC;jj++)if(!surPlace(i,jj)&&!occupe(i,jj)&&!natureA(i,jj))libres.push([i,jj])});
  let arbres=S.nature.filter(n=>possede(n.i,n.j)&&(n.t==='arbre'||n.t==='pousse')).length;const max=Math.max(4,Math.floor(libres.length*.06));
  for(let k=0;k<jours*2&&arbres<max&&libres.length;k++){const [i,jj]=libres.splice(Math.floor(Math.random()*libres.length),1)[0];
    const t=Date.now();S.nature.push({id:uid(),i,j:jj,t:'arbre',depuis:t,maj:t});arbres++}}
function purgerSouches(){const t=Date.now();S.nature=S.nature.filter(n=>!(n.t==='souche'&&t-n.depuis>SOUCHE_H*3600000))}
function natureVivante(){if(!S)return;semerNature();pousserArbres();purgerSouches()}
// une image de la session Images posée sur la case (i,j) : largeur = le losange, pointe avant de l'image sur celle de la case
function imageCase(nom,i,j){const H=HAUT_NATURE[nom],L=P(i,j+1),R=P(i+1,j),B=P(i+1,j+1),k=(R[0]-L[0])/400;
  return `<image href="img/v3/${nom}.webp" x="${L[0]}" y="${B[1]-H*k}" width="${400*k}" height="${H*k}"/>`}
function dessinNature(n,sa){const [cx,cy]=P(n.i+.5,n.j+.5),st=stade(n);let h='';
  const img=sa!=='hiver';   // l'hiver garde les dessins enneigés
  if(st==='arbre')h=(sa==='printemps'||sa==='ete')?imageCase(hasard(n.i,n.j,9)<.5?'decor-arbre-1':'decor-arbre-2',n.i,n.j):arbre(cx,cy+6,sa,1.05);
  else if(img&&st==='pousse')h=imageCase('decor-pousse',n.i,n.j);
  else if(img&&st==='souche')h=imageCase('decor-souche',n.i,n.j);
  else if(img&&st==='rocher')h=imageCase((n.n||1)>=2?'decor-rocher-gros':'decor-rocher-petit',n.i,n.j);
  else if(img&&st==='butte')h=imageCase('decor-butte',n.i,n.j);
  else if(st==='pousse')h=`<ellipse cx="${cx}" cy="${cy+3}" rx="9" ry="4" fill="#00000022"/><rect x="${cx-1.5}" y="${cy-16}" width="3" height="18" fill="#6D4C41"/><ellipse cx="${cx-6}" cy="${cy-14}" rx="7" ry="4" fill="#6FBF4A" transform="rotate(-25 ${cx-6} ${cy-14})"/><ellipse cx="${cx+6}" cy="${cy-18}" rx="7" ry="4" fill="#5AA83B" transform="rotate(25 ${cx+6} ${cy-18})"/>`;
  else if(st==='souche')h=`<ellipse cx="${cx}" cy="${cy+3}" rx="12" ry="5" fill="#00000022"/><rect x="${cx-9}" y="${cy-8}" width="18" height="10" fill="#7A4E2D"/><ellipse cx="${cx}" cy="${cy-8}" rx="9" ry="4.5" fill="#D9B27C" stroke="#7A4E2D"/><ellipse cx="${cx}" cy="${cy-8}" rx="4" ry="2" fill="none" stroke="#A8875A"/>`;
  else if(st==='rocher'){const k=.75+.3*(n.n||1);h=`<ellipse cx="${cx}" cy="${cy+3}" rx="${14*k}" ry="${6*k}" fill="#00000026"/><ellipse cx="${cx}" cy="${cy-4*k}" rx="${13*k}" ry="${9*k}" fill="#9E9E9E" stroke="#5F5F5F" stroke-width="1.5"/><ellipse cx="${cx-4*k}" cy="${cy-8*k}" rx="${5*k}" ry="${3*k}" fill="#C9C9C9"/><path d="M${cx+2} ${cy-10*k}l${4*k} ${6*k}" stroke="#6E6E6E"/>`}
  else if(st==='butte')h=`<ellipse cx="${cx}" cy="${cy}" rx="24" ry="11" fill="#9C7650" stroke="#6B4A2C"/><ellipse cx="${cx}" cy="${cy-4}" rx="17" ry="7" fill="#B58C5C"/><ellipse cx="${cx-3}" cy="${cy-7}" rx="9" ry="3.5" fill="#7FB55A"/>`;
  return `<g data-n="${n.id}" style="${mode?'pointer-events:none;opacity:.55':'cursor:pointer'}">${h}</g>`}
function toucherNature(id,ev){const n=(S.nature||[]).find(x=>x.id===id);if(!n)return;
  if(!possede(n.i,n.j)){message='Ce terrain n\'est pas encore à vous : touchez le + pour l\'acheter.';rendu();return}
  const st=stade(n),sx=ev.clientX||innerWidth/2,sy=ev.clientY||innerHeight/2,t=Date.now();let gains=[];
  const enleve=()=>{S.nature=S.nature.filter(x=>x!==n)};
  if(st==='pousse'){message=`🌱 Cette jeune pousse sera un arbre vers ${heure(n.depuis+POUSSE_H*3600000)}.`;rendu();return}
  if(st==='arbre'){n.t='souche';n.depuis=t;n.maj=t;gains=[['bois',5],['etoiles',1]];SON.coupe();message='🪓 Arbre coupé : +5 🪵. La souche partira toute seule.'}
  else if(st==='souche'){enleve();message='La souche est enlevée : la case est libre.'}
  else if(st==='rocher'){n.n=(n.n||1)-1;n.maj=t;gains=[['pierre',2]];SON.tac();
    if(n.n<=0){enleve();message='⛏️ Rocher cassé : +2 🪨. La case est libre.'}else message=`⛏️ +2 🪨. Encore ${n.n} coup${n.n>1?'s':''} pour le casser.`}
  else if(st==='butte'){enleve();gains=[['pierre',3]];SON.tac();message='⛏️ La butte est aplanie : +3 🪨. On peut y construire.'}
  gains.forEach(([k,q])=>S.stock[k]=(S.stock[k]||0)+q);
  sauve();rendu();if(gains.length){etincelles(sx,sy);gains.forEach(([k,q],m)=>setTimeout(()=>voler(sx,sy,k,q),m*160))}}

/* Les chemins : un bâtiment est relié si une case qui le borde est la place ou un chemin relié à la place. */
function relies(){
  const ok=new Set(), file=[];
  for(let a=0;a<2;a++)for(let c=0;c<2;c++){ok.add((PLACE.i+a)+','+(PLACE.j+c));file.push([PLACE.i+a,PLACE.j+c])}
  while(file.length){const [i,j]=file.shift();
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=(i+di)+','+(j+dj),o=occupe(i+di,j+dj);
      if(!ok.has(k)&&o&&o.type==='chemin'){ok.add(k);file.push([i+di,j+dj])}}}
  return ok;
}
function estRelie(o,ok){const t=BAT[o.type].t;
  for(let a=-1;a<=t;a++)for(let c=-1;c<=t;c++){if((a<0||a>=t)===(c<0||c>=t))continue;if(ok.has((o.i+a)+','+(o.j+c)))return true}
  return false}
function bonus(o){let b=0;S.b.forEach(d=>{const B=BAT[d.type];if(B.sorte!=='deco')return;
  const t=BAT[o.type].t;if(d.i>=o.i-2&&d.i<=o.i+t+1&&d.j>=o.j-2&&d.j<=o.j+t+1)b+=B.bonus});return Math.min(b,.6)}
function pret(o,ok){const B=BAT[o.type];if(!estRelie(o,ok))return false;
  if(B.sorte==='atelier')return o.fin!=null&&Date.now()>=o.fin;
  if(B.sorte==='maison')return Date.now()-o.depuis>=60*60000;
  return false}
function gainMaison(o){const h=Math.min(72,Math.floor((Date.now()-o.depuis)/3600000));return Math.ceil(h*BAT[o.type].parHeure*mult(o)*(1+bonus(o)))}

/* ===================== Le son : petits bruits et musique douce, synthétisés (aucun fichier) ===================== */
let AC=null, musiqueMinuteur=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch{AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function note(f,t0,dur,type,vol){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.12,a.currentTime+t0+.01);
  g.gain.exponentialRampToValueAtTime(.0005,a.currentTime+t0+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
const SON={
  ramasse(){note(988,0,.18,'sine',.14);note(1319,.08,.25,'sine',.12);note(1760,.16,.3,'triangle',.06)},
  piece(){note(1568,0,.12,'triangle',.07)},
  pose(){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(180,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(60,a.currentTime+.2);g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
    o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.3);note(660,.05,.15,'triangle',.05)},
  lance(){note(523,0,.12,'triangle',.08);note(784,.1,.18,'triangle',.08)},
  non(){note(220,0,.2,'sine',.08)},
  coupe(){note(196,0,.09,'square',.05);note(165,.11,.1,'square',.05);note(523,.22,.2,'triangle',.06)},
  tac(){note(988,0,.05,'square',.04);note(659,.05,.12,'triangle',.06)}};
const GAMME=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
function musique(on){
  clearInterval(musiqueMinuteur);musiqueMinuteur=null;if(!on||!audio())return;
  let k=3,pas=0;
  musiqueMinuteur=setInterval(()=>{if(document.hidden)return;
    if(pas%8===0){note(GAMME[[0,3,4,2][(pas/8)%4]]/2,0,2.6,'sine',.035)}
    if(Math.random()<.7){k=Math.max(0,Math.min(GAMME.length-1,k+[-2,-1,1,2][Math.floor(Math.random()*4)]));note(GAMME[k],0,.9,'triangle',.03)}
    pas++},420);
}
let sonPret=false;
function premierGeste(){if(sonPret)return;sonPret=true;audio();if(S&&S.musique)musique(true)}

/* ===================== Effets à l'écran ===================== */
function versEcran(x,y){const svg=$('.carte svg');if(!svg)return [innerWidth/2,innerHeight/2];const p=svg.createSVGPoint();p.x=x;p.y=y;
  const q=p.matrixTransform(svg.getScreenCTM());return [q.x,q.y]}
function etincelles(sx,sy){const fx=$('#fx');for(let n=0;n<12;n++){const e=document.createElement('div');e.className='etin';
  const a=n/12*Math.PI*2,r=40+Math.random()*30;e.style.left=sx-5+'px';e.style.top=sy-5+'px';e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r+'px');
  fx.appendChild(e);setTimeout(()=>e.remove(),750)}}
function poussiere(sx,sy){const fx=$('#fx');for(let n=0;n<6;n++){const e=document.createElement('div');e.className='poussiere';
  e.style.left=sx-13+(n-3)*12+'px';e.style.top=sy-8+'px';e.style.setProperty('--dx',(n-3)*14+'px');fx.appendChild(e);setTimeout(()=>e.remove(),750)}}
function voler(sx,sy,k,n){
  const cible=document.querySelector(`[data-res="${k}"]`);if(!cible)return;const r=cible.getBoundingClientRect(),tx=r.left+24,ty=r.top+20;
  const combien=Math.min(6,Math.max(1,Math.round(n/4)));
  for(let m=0;m<combien;m++){const e=document.createElement('div');e.className='vol';e.textContent=RES[k].e;
    e.style.left=sx-17+'px';e.style.top=sy-17+'px';$('#fx').appendChild(e);
    setTimeout(()=>{e.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(.7)`;e.style.opacity='.3'},40+m*90);
    setTimeout(()=>{e.remove();const c=document.querySelector(`[data-res="${k}"]`);if(c){c.classList.remove('gonfle');void c.offsetWidth;c.classList.add('gonfle')}SON.piece()},880+m*90)}
}

/* ===================== Dessin en losanges ===================== */
const TW=34, TH=17, OX=MONDE*TW, OY=70;
const P=(i,j)=>[OX+(i-j)*TW,OY+(i+j)*TH];
function poly(pts,f,s,extra){return `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${f}" stroke="${s}" stroke-width="1" stroke-linejoin="round" ${extra||''}/>`}
const los=(i,j,t=1)=>[P(i,j),P(i+t,j),P(i+t,j+t),P(i,j+t)];
const up=(p,z)=>[p[0],p[1]-z];
function nuit(){const h=new Date().getHours();return h>=20||h<7}
function boite(o,mur,toit){const t=BAT[o.type].t,A=P(o.i,o.j),B=P(o.i+t,o.j),C=P(o.i+t,o.j+t),D=P(o.i,o.j+t),z=34;
  let h=poly([D,C,up(C,z),up(D,z)],mur,'#00000055')+poly([C,B,up(B,z),up(C,z)],mur,'#00000055','style="filter:brightness(.85)"');
  const ap=[(A[0]+C[0])/2,(A[1]+C[1])/2-z-30];
  h+=poly([up(D,z),up(C,z),ap],toit,'#00000055')+poly([up(C,z),up(B,z),ap],toit,'#00000055','style="filter:brightness(.8)"');
  const mx=(D[0]+C[0])/2,my=(D[1]+C[1])/2;
  h+=`<polygon points="${mx-6},${my+3} ${mx+6},${my-3} ${mx+6},${my-21} ${mx-6},${my-15}" fill="#6D4C41"/>`;
  const fen=nuit()?'#FFD86B':'#CFE3F0';h+=`<rect x="${mx-26}" y="${my-24}" width="11" height="11" fill="${fen}" stroke="#5D4037"/><rect x="${mx+18}" y="${my-30}" width="11" height="11" fill="${fen}" stroke="#5D4037"/>`;
  h+=`<circle cx="${ap[0]}" cy="${ap[1]+28}" r="15" fill="#FFF9E8" stroke="#00000044"/><text x="${ap[0]}" y="${ap[1]+36}" font-size="19" text-anchor="middle">${BAT[o.type].e}</text>`;
  return {h,top:ap[1]};
}
function imageCalee(nom,o){const t=BAT[o.type].t,c=CALAGE[nom]||[0,195,400,195,400,391];
  const L=P(o.i,o.j+t),R=P(o.i+t,o.j),B=P(o.i+t,o.j+t),[mx,my]=P(o.i+t/2,o.j+t/2);
  const k=(R[0]-L[0])/(c[2]-c[0]),w=c[4]*k,h=c[5]*k,x=mx-k*(c[0]+c[2])/2,y=my-k*(c[1]+c[3])/2,haut=y-40;
  const id='coupe-'+o.id;

/* ===================== Le village à deux (25/10, Florian : « qu'elles puissent développer leur petit village ensemble ») =====
   La liaison est celle du rami (PeerJS, sans compte) : on se synchronise quand les deux jeux sont ouverts en même temps.
   Commun : les bâtiments, les arbres et rochers, les morceaux de terrain, l'époque, la frise, le monument et la fête.
   À chacune : ses réserves, ses cœurs et ses commandes. La fusion est à trois (la dernière version commune, la mienne,
   la sienne) : ce que chacune a fait hors connexion se rejoint, rien ne se perd. */
const SOEUR={peer:null,conn:null,etat:'seul'};

  sc.onload=suite;sc.onerror=()=>{sc.remove();SOEUR.etat='hors';majSoeur();setTimeout(()=>{if(lien())chargerPeer(suite)},20000)};document.head.appendChild(sc)}
function couperLien(){const c=SOEUR.conn,p=SOEUR.peer;SOEUR.conn=null;SOEUR.peer=null;try{c&&c.close()}catch{}try{p&&p.destroy()}catch{}}

function surErreur(p,e){if(SOEUR.peer!==p)return;

function hote(code){const p=new Peer(ID_SOEUR(code),{debug:0});SOEUR.peer=p;
  p.on('open',()=>{if(SOEUR.etat!=='ensemble')SOEUR.etat='attente';majSoeur()});
  p.on('connection',c=>{if(SOEUR.conn&&SOEUR.conn!==c){try{SOEUR.conn.close()}catch{}}brancher(c)});
  p.on('error',e=>{if(e.type==='unavailable-id'){try{p.destroy()}catch{}if(SOEUR.peer===p)SOEUR.peer=null;setTimeout(()=>{if(lien()&&!SOEUR.peer)hote(code)},5000);return}surErreur(p,e)});
  p.on('disconnected',()=>setTimeout(()=>{if(SOEUR.peer===p&&!p.destroyed)try{p.reconnect()}catch{}},2000))}

  const c=p.connect(ID_SOEUR(code),{reliable:true});brancher(c);setTimeout(()=>{if(SOEUR.conn===c&&!c.open){try{c.close()}catch{}joindre(code)}},9000)}
function brancher(c){SOEUR.conn=c;

  c.on('data',recevoir);
  c.on('close',()=>{if(SOEUR.conn!==c)return;SOEUR.conn=null;SOEUR.etat='attente';majSoeur();const L=lien();if(L&&L.role==='invite')setTimeout(()=>joindre(L.code),4000)})}

  fusion(m.p);

// une liste partagée : la version la plus récente gagne ; ce que l'une a retiré (un chemin, un arbre coupé) ne revient pas
function fusionListe(mienne,sienne,commune){const mien=new Map((mienne||[]).map(o=>[o.id,o])),sien=new Map((sienne||[]).map(o=>[o.id,o])),

  bats.forEach(o=>{if(libre(o.type,o.i,o.j,o.id)){S.b.push(o);return}
    let mieux=null;for(let r=1;r<MONDE&&!mieux;r++)for(let di=-r;di<=r&&!mieux;di++)for(let dj=-r;dj<=r&&!mieux;dj++){
      if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;if(libre(o.type,o.i+di,o.j+dj,o.id))mieux=[o.i+di,o.j+dj]}
    if(mieux){o.i=mieux[0];o.j=mieux[1];o.maj=Date.now()}S.b.push(o)});
  // un arbre ou un rocher sous un bâtiment s'efface, deux sur la même case n'en font qu'un
  const vus=new Set();S.nature=S.nature.filter(n=>{const k=n.i+','+n.j;if(vus.has(k)||occupe(n.i,n.j)||surPlace(n.i,n.j))return false;vus.add(k);return true});
  // l'époque la plus avancée, la frise des deux
  const idx=e=>EPOQUES.findIndex(x=>x.id===e);if(idx(T.epoque)>idx(S.epoque))S.epoque=T.epoque;
  S.frise=[...new Set([...(S.frise||[]),...(T.frise||[])])];
  // le monument et la fête : chacune verse sa part ; ce qu'elles ont versé chacune de son côté s'additionne
  const somme=(m,t,b)=>{const r={};new Set([...Object.keys(m||{}),...Object.keys(t||{})]).forEach(k=>{r[k]=Math.max(0,(m&&m[k]||0)+(t&&t[k]||0)-(b&&b[k]||0))});return r};
  if(T.monument){const m=S.monument;
    if(!m||T.monument.niveau>m.niveau)S.monument=clone(T.monument);
    else if(T.monument.niveau===m.niveau){const b0=B.monument&&B.monument.niveau===m.niveau?B.monument.verse:{};m.verse=somme(m.verse,T.monument.verse,b0)}}
  if(T.saison){const m=S.saison,t=T.saison;
    if(!m||t.semaine>m.semaine){const d=m&&m.decos;S.saison=clone(t);S.saison.decos=S.saison.decos||{};if(d)Object.keys(d).forEach(k=>S.saison.decos[k]=Math.max(S.saison.decos[k]||0,d[k]||0))}
    else if(t.semaine===m.semaine){const b0=B.saison&&B.saison.semaine===m.semaine?B.saison.verse:{};m.verse=somme(m.verse,t.verse,b0);m.finie=!!(m.finie||t.finie);
      m.decos=m.decos||{};Object.keys(t.decos||{}).forEach(k=>m.decos[k]=Math.max(m.decos[k]||0,t.decos[k]||0))}}
  S.base=clone(partage())}

/* Les parties de cartes versent leurs pièces dans la caisse (même tablette) ; elles rapportent aussi des étoiles. */
function encaisser(){
  let c=0;try{c=+(localStorage.getItem('village:caisse')||0)}catch{}
  if(c>0&&S){S.stock.pieces+=c;S.stock.etoiles+=Math.ceil(c/10);try{localStorage.setItem('village:caisse','0')}catch{}
    message=`🃏 Vos parties de cartes ont rapporté ${c} pièces et ${Math.ceil(c/10)} ⭐ !`;sauve()}

    if(ni!==mode.i||nj!==mode.j){mode.i=Math.max(-2,Math.min(MONDE,ni));mode.j=Math.max(-2,Math.min(MONDE,nj));porte.bouge=true;majFantome()}return}

  CAM.i=Math.max(-4,Math.min(MONDE+4,ci));CAM.j=Math.max(-4,Math.min(MONDE+4,cj));rendu()});
// les bulles apparaissent toutes seules quand c'est prêt, et le soir tombe à l'heure de la tablette
// (et les potagers poussent, les bûches s'empilent)
let signe='';
