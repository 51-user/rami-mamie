<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marionnettes</title>
<style>
  :root { --fond: #1d2418; --texte: #efe6cf; --doux: #b8ad92; --bouton: #3b4a2c; }
  html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  canvas { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; display: block; }
  .barre { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 10px 16px; }
  select, button, a.lien { font: inherit; font-size: 14px; color: var(--texte); background: var(--bouton); border: 0; border-radius: 6px; padding: 6px 10px; text-decoration: none; }
  .doux { color: var(--doux); font-size: 13px; }
</style>
</head>
<body>
<canvas id="scene" width="1280" height="720"></canvas>
<div class="barre" id="barre">
  <select id="choix" aria-label="Personnage"></select>
  <button id="filmer">Enregistrer 20 s</button>
  <span class="doux" id="etat"></span>
</div>
<script>
// LE MOTEUR COMMUN DES MARIONNETTES (25/10/2026, Florian : « industrialise moi donc tout ça »).
// Il lit la fiche de chaque personnage (marionnettes/<id>/montage.json, faite par recette/marionnette.py) : pièces placées
// sur l'image du roster, rôles, pivots, gestes. Quatre façons de bouger : marche, sautille, glisse, roule. La marionnette
// avance du côté où elle regarde (miroir sinon). Règle Greenlight : chacun a sa séquence de gestes à lui.
// ?perso=<id> | ?tous=1 · ?t=12.5 fige · ?apercu=1 filme selon marionnettes/apercu.json et envoie la vidéo.
const W = 1280, H = 720;
const cv = document.getElementById("scene"), cx = cv.getContext("2d");
const Q = new URLSearchParams(location.search);
const FIGE = Q.has("t") ? parseFloat(Q.get("t")) : null;
const lisse = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const entre = (t, a, b) => b <= a ? (t >= a ? 1 : 0) : lisse((t - a) / (b - a));
const rad = d => d * Math.PI / 180;
const charger = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
const DECOR = { fond: "cartes/fond-vallee.webp", buisson: "img/v3/decor-buisson.webp", fleurs: "img/v3/decor-fleurs.webp",
  lanterne: "img/v3/deco-lanterne.webp", rocher: "img/v3/decor-rocher-petit.webp", arbre: "img/v3/decor-arbre-1.webp" };

// ── le décor ──────────────────────────────────────────────────────────────────────────────────────────────
function pose(im, x, y, l) { if (im) cx.drawImage(im, x, y - l * im.height / im.width, l, l * im.height / im.width); }
function decor() {
  const f = DECOR.fond;
  if (f) { cx.filter = "blur(3px) brightness(0.78) saturate(0.9)"; cx.drawImage(f, 0, -60, W, W * f.height / f.width); cx.filter = "none"; }
  const g = cx.createLinearGradient(0, 470, 0, H);
  g.addColorStop(0, "rgba(96,122,58,0)"); g.addColorStop(0.12, "#6f8a3c"); g.addColorStop(0.22, "#c9a46e");
  g.addColorStop(0.85, "#b98f5c"); g.addColorStop(1, "#7d9a44");
  cx.fillStyle = g; cx.fillRect(0, 470, W, H - 470);
  cx.fillStyle = "rgba(255,240,200,0.08)";
  for (let i = 0; i < 26; i++) { const x = (i * 197) % W, y = 560 + (i * 53) % 120; cx.beginPath(); cx.ellipse(x, y, 10 + i % 7, 4, 0, 0, 7); cx.fill(); }
  pose(DECOR.arbre, 40, 520, 230); pose(DECOR.arbre, 1010, 515, 250); pose(DECOR.lanterne, 860, 540, 120);
  pose(DECOR.buisson, 300, 535, 110); pose(DECOR.fleurs, 620, 540, 120); pose(DECOR.rocher, 1180, 550, 70);
}
function ombre(x, y, rx, ry) { cx.fillStyle = "rgba(40,30,15,0.28)"; cx.beginPath(); cx.ellipse(x, y, rx, ry, 0, 0, 7); cx.fill(); }

// ── un personnage ─────────────────────────────────────────────────────────────────────────────────────────
async function chargerPerso(id) {
  const r = await fetch("marionnettes/" + id + "/montage.json"); if (!r.ok) return null;
  const f = await r.json();
  f.img = {};
  await Promise.all(f.pieces.map(async p => { if (f.placement && f.placement[p.nom]) f.img[p.nom] = await charger("marionnettes/" + id + "/" + p.nom + ".webp"); }));
  // l'emprise du personnage sur l'image du roster : sa hauteur fixe l'échelle, son bas est le sol
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n in (f.placement || {})) { const [x, y, w, h] = f.placement[n]; if ((f.pieces.find(p => p.nom === n) || {}).cache) continue;
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }
  if (f.dessin === "code") { x0 = -50; x1 = 50; y0 = -100; y1 = 0; }
  f.emprise = { x0, y0, x1, y1 };
  f.echelle = (f.hauteur_ecran || 220) / (y1 - y0);
  f.racine = f.pieces.find(p => p.role === "racine") || f.pieces[0];
  f.fwd = f.regard === "gauche" ? -1 : 1;
  const M = f.mouvement || {};
  const largeur = (x1 - x0) * f.echelle;
  f.trajet = W + largeur + 200;
  f.duree = f.trajet / (M.vitesse || 90) + (f.arret ? f.arret.duree : 0);
  return f;
}

// la somme des gestes sur une pièce à l'instant u de la halte
function gestes(f, nom, u) {
  const g = { angle: 0, dx: 0, dy: 0, echelle: 0, visible: false, saut: 0 };
  if (!f.arret || u < 0 || u > f.arret.duree) return g;
  for (const k of f.gestes || []) {
    if (k.piece !== nom) continue;
    if (k.visible) { if (u >= k.visible[0] && u <= k.visible[1]) g.visible = true; continue; }
    let e = 1;
    if (k.monte) e *= entre(u, k.monte[0], k.monte[1]);
    if (k.descend) e *= 1 - entre(u, k.descend[0], k.descend[1]);
    if (k.saut) { const a = k.monte[0], b = k.monte[1]; if (u > a && u < b) g.saut += k.saut * Math.sin(Math.PI * (u - a) / (b - a)); continue; }
    g.angle += (k.angle || 0) * e; g.dx += (k.dx || 0) * e; g.dy += (k.dy || 0) * e; g.echelle += (k.echelle || 0) * e;
    if (k.oscille && u > k.oscille[0] && u < k.oscille[1]) g.angle += k.oscille[2] * Math.sin(2 * Math.PI * k.oscille[3] * (u - k.oscille[0]));
  }
  return g;
}

// l'état du déplacement à l'instant t (temps propre au personnage)
function etat(f, t) {
  const M = f.mouvement || {}, A = f.arret;
  const marche = !A ? t : t < A.debut ? t : t < A.debut + A.duree ? A.debut : t - A.duree;
  const amp = !A ? 1 : t < A.debut ? 1 - entre(t, A.debut - 0.35, A.debut) : t < A.debut + A.duree ? 0 : entre(t, A.debut + A.duree, A.debut + A.duree + 0.35);
  const v = M.vitesse || 90, per = M.periode || 0.8;
  const s = { d: marche * v, phi: 2 * Math.PI * marche / per, a: amp, dy: 0, sq: 0, penche: 0, roule: 0, etire: 0, u: A ? t - A.debut : -1 };
  const mode = M.mode || "marche";
  if (mode === "marche") {
    s.dy = -(M.rebond || 7) * (1 + Math.cos(2 * s.phi)) / 2 * amp;            // plus haut jambes droites
    s.sq = 0.06 * Math.pow(Math.abs(Math.sin(s.phi)), 6) * amp;               // écrasé au contact
    s.penche = f.fwd * (M.penche || 5) * amp;
  } else if (mode === "sautille") {
    const u = (marche / per) % 1;
    s.dy = -(M.hauteur || 30) * Math.sin(Math.PI * u) * amp;
    s.sq = (0.14 * Math.pow(1 - Math.sin(Math.PI * u), 6) - 0.06 * Math.sin(Math.PI * u)) * amp;   // écrasé au sol, étiré en l'air
    s.phi = 2 * Math.PI * u;
  } else if (mode === "glisse") {
    if (M.style === "chenille") {                                            // le pied s'étire, l'arrière rattrape
      const n = marche / per, k = Math.floor(n), fr = n - k;
      s.d = (k + lisse(Math.max(0, (fr - 0.5) / 0.5))) * v * per;
      s.etire = (M.etirement || 0.12) * Math.sin(Math.PI * fr) * amp;
    } else {                                                                  // la robe : glisse douce, dandine
      s.penche = 3 * Math.sin(s.phi) * amp; s.dy = -2 * Math.abs(Math.sin(s.phi)) * amp;
    }
  } else if (mode === "roule") {
    const r = f.dessin === "code" ? (f.hauteur_ecran || 110) * 0.31 : (f.emprise.y1 - f.emprise.y0) * f.echelle / 2;
    const ang = (s.d / r) * 180 / Math.PI, droit = Math.round(ang / 360) * 360;   // à l'arrêt, il se remet droit
    s.roule = droit + (ang - droit) * amp;
  }
  return s;
}

// angle d'une pièce selon son rôle
function angleRole(f, p, s, t) {
  const M = f.mouvement || {}, A = M.amplitude || 24, B = M.bras || 16, fwd = f.fwd, a = s.a, sn = Math.sin(s.phi);
  const mode = M.mode || "marche";
  switch (p.role) {
    case "jambe-proche": return mode === "marche" ? fwd * A * sn * a : 8 * Math.sin(s.phi) * a;
    case "jambe-loin": return mode === "marche" ? -fwd * A * sn * a : -8 * Math.sin(s.phi) * a;
    case "bras-proche": return -fwd * B * sn * a;
    case "bras-loin": return fwd * B * sn * a;
    case "tete": return 3 * Math.sin(2 * s.phi - 0.5) * a + 1.5 * Math.sin(t * 1.3) * (1 - a);
    case "suiveur": case "objet":
      return fwd * (p.amplitude || 8) * Math.sin(s.phi - (p.retard || 1)) * a + (p.amplitude || 8) * 0.35 * Math.sin(t * 1.7 + (p.retard || 1)) * (1 - a);
    default: return 0;
  }
}

function dessinerPerso(f, t, x, sol, dir) {
  if (f.regard === "face") f.fwd = dir;                                 // de face : l'avant est là où il va
  const s = etat(f, t), e = f.emprise, k = f.echelle;
  const m = f.regard === "face" ? 1 : dir * f.fwd;                    // miroir : il avance du côté où il regarde
  const gr = gestes(f, "racine", s.u);
  const dy = s.dy - gr.saut;
  ombre(x, sol + 2, (e.x1 - e.x0) * k * 0.42 * (1 - Math.min(0.4, gr.saut / 120)), 10);
  if (f.dessin === "code") { dessinCode(f, s, x, sol + dy, m, t); return; }
  const R = f.racine, rp = R.pivot;
  // la racine : posée au sol (le bas de l'emprise), penchée, écrasée ; la chenille s'étire depuis l'arrière
  let base = new DOMMatrix().translate(x, sol + dy);
  if (s.roule) base = base.translate(0, -(e.y1 - e.y0) * k / 2).rotate(s.roule * dir).translate(0, (e.y1 - e.y0) * k / 2);
  base = base.rotate(s.penche * m).scale(m * k * (1 + s.sq * 0.7), k * (1 - s.sq));
  const arriere = f.fwd > 0 ? e.x0 : e.x1;
  const cxr = f.mouvement && f.mouvement.style === "chenille" ? arriere : (e.x0 + e.x1) / 2;
  if (s.etire) base = base.translate(cxr - (e.x0 + e.x1) / 2, 0).scale(1 + s.etire, 1 - s.etire * 0.3).translate(-(cxr - (e.x0 + e.x1) / 2), 0);
  base = base.translate(-(e.x0 + e.x1) / 2, -e.y1);
  const mat = {}, cumul = {};
  const faire = (p) => {
    if (mat[p.nom]) return mat[p.nom];
    const parent = p.parent ? f.pieces.find(q => q.nom === p.parent) : null;
    const T = parent ? faire(parent) : base;
    const g = gestes(f, p.nom, s.u);
    let ang = (p.role === "racine" ? 0 : angleRole(f, p, s, t)) + g.angle;
    if (p.role === "objet") ang -= (parent ? cumul[parent.nom] || 0 : 0) * 0.85;     // un objet pend : il garde sa verticale
    cumul[p.nom] = (parent ? cumul[parent.nom] || 0 : 0) + ang;
    const P = p.pivot || rp, Aa = p.attache || P;
    let M2 = T.translate(Aa[0] + g.dx, Aa[1] + g.dy);
    // les jambes qui reviennent vers l'avant se lèvent
    if ((f.mouvement || {}).mode === "marche" && (p.role === "jambe-proche" || p.role === "jambe-loin")) {
      const c = Math.cos(s.phi), leve = Math.max(0, p.role === "jambe-proche" ? -c : c) * s.a;
      M2 = M2.translate(0, -0.035 * (e.y1 - e.y0) * leve);
    }
    if (p.rigide && s.etire) M2 = M2.scale(1 / (1 + s.etire), 1 / (1 - s.etire * 0.3));
    M2 = M2.rotate(ang).scale(1 + g.echelle).translate(-P[0], -P[1]);
    mat[p.nom] = M2; return M2;
  };
  f.pieces.forEach(faire);
  const ordre = [...f.pieces].sort((a, b) => (a.z || 0) - (b.z || 0));
  for (const p of ordre) {
    const im = f.img[p.nom], r = f.placement[p.nom]; if (!im || !r) continue;
    if (p.cache && !gestes(f, p.nom, s.u).visible) continue;
    cx.setTransform(mat[p.nom]);
    if (p.fil) {                                                      // un fil trop fin pour une pièce : tracé du pivot à la pièce
      cx.beginPath(); cx.moveTo(p.pivot[0], p.pivot[1]); cx.lineTo(r[0] + r[2] / 2, r[1] + r[3] * 0.2);
      cx.strokeStyle = "rgba(40,30,22,0.9)"; cx.lineWidth = 3; cx.stroke();
    }
    cx.drawImage(im, r[0], r[1], r[2], r[3]);
  }
  cx.setTransform(1, 0, 0, 1, 0, 0);
}

// les trois dessinés par le code (grenouille, patate, hérisson) : leurs formes de habitants.py, portées ici
// Portage fidèle des formes de habitants.py (mêmes proportions, en fractions de la hauteur H, pieds en (0, 0)) :
// ils restent tels que Florian les a gardés, « ne le change surtout pas ».
function dessinCode(f, s, x, y, m, t) {
  const H = f.hauteur_ecran || 110, rg = 1, pas = Math.sin(s.phi) * s.a;
  cx.save(); cx.translate(x, y);
  if (s.roule) { cx.translate(0, -H * 0.31); cx.rotate(rad(s.roule * m)); cx.translate(0, H * 0.31); }   // roule vers où il va
  cx.scale(m * (1 + s.sq * 0.7), 1 - s.sq);
  if ((f.mouvement || {}).mode !== "roule") cx.transform(1, 0, -(f.code === "patate" ? 0.14 : 0.10) * pas, 1, 0, 0);   // dandine : le haut penche
  const mul = (c, k) => "rgb(" + c.map(v => Math.round(Math.min(255, v * k))).join(",") + ")";
  const mix = (a, b, u) => a.map((v, i) => Math.round(v * (1 - u) + b[i] * u));
  const NOIR = "rgb(30,26,24)";
  const ell = (x0, y0, x1, y1, c, ep) => { ep = ep || 1.2;
    cx.beginPath(); cx.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, 0, 0, 7); cx.fillStyle = mul(c, 0.55); cx.fill();
    cx.beginPath(); cx.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.max(0.5, Math.abs(x1 - x0) / 2 - ep), Math.max(0.5, Math.abs(y1 - y0) / 2 - ep), 0, 0, 7); cx.fillStyle = mul(c, 1); cx.fill(); };
  const disque = (x0, y0, x1, y1, c, contour) => { cx.beginPath(); cx.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, 0, 0, 7);
    cx.fillStyle = c; cx.fill(); if (contour) { cx.lineWidth = 1; cx.strokeStyle = contour; cx.stroke(); } };
  const ligne = (a, b, c, l) => { cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.strokeStyle = c; cx.lineWidth = l; cx.lineCap = "round"; cx.stroke(); };
  const sourire = (ex, ey, r) => { r = Math.max(r, 3.4); cx.beginPath(); cx.ellipse(ex, ey, r, r * 0.6, 0, rad(20), rad(160)); cx.strokeStyle = NOIR; cx.lineWidth = 1.2; cx.stroke(); };
  const bob = -Math.abs(pas) * H * 0.04;
  if (f.code === "grenouille") {
    const vert = [118, 152, 98], clair = mix(vert, [220, 230, 150], 0.45);
    ell(-H * 0.2, -H * 0.42 + bob, H * 0.2, -H * 0.02 + bob, clair);
    ell(-H * 0.36, -H * 0.78 + bob, H * 0.36, -H * 0.3 + bob, vert);
    for (const k of [-1, 1]) {
      ell(k * H * 0.2 - H * 0.1, -H * 0.86 + bob, k * H * 0.2 + H * 0.1, -H * 0.66 + bob, vert);
      disque(k * H * 0.2 - H * 0.045 + rg * H * 0.02, -H * 0.8 + bob, k * H * 0.2 + H * 0.045 + rg * H * 0.02, -H * 0.71 + bob, NOIR);
    }
    sourire(0, -H * 0.55 + bob, H * 0.12);
  } else if (f.code === "herisson") {
    const brun = [130, 96, 70], creme = [226, 200, 170], laine = [214, 140, 118];
    for (let i = 0; i < 9; i++) {
      const a = rad(120 + i * 15), ox = -rg * H * 0.06, px = ox + H * 0.34 * Math.cos(a), py = -H * 0.42 + bob + H * 0.3 * Math.sin(a);
      cx.beginPath(); cx.moveTo(ox, -H * 0.4 + bob); cx.lineTo(px + H * 0.05 * Math.cos(a + 0.3), py + H * 0.05 * Math.sin(a + 0.3));
      cx.lineTo(px + H * 0.05 * Math.cos(a - 0.3), py + H * 0.05 * Math.sin(a - 0.3)); cx.fillStyle = mul(brun, 0.85); cx.fill();
    }
    ell(-H * 0.3, -H * 0.6 + bob, H * 0.3, -H * 0.02 + bob, brun);
    ell(-H * 0.2 + rg * H * 0.04, -H * 0.5 + bob, H * 0.2 + rg * H * 0.04, -H * 0.14 + bob, creme);
    for (const k of [-1, 1]) disque(rg * H * 0.04 + k * H * 0.08 - H * 0.055, -H * 0.42 + bob, rg * H * 0.04 + k * H * 0.08 + H * 0.055, -H * 0.31 + bob, "rgb(236,240,244)", "rgb(70,60,60)");
    for (const k of [-1, 1]) disque(rg * H * 0.04 + k * H * 0.08 - H * 0.02, -H * 0.39, rg * H * 0.04 + k * H * 0.08 + H * 0.02, -H * 0.35, NOIR);
    disque(rg * H * 0.06 - H * 0.03, -H * 0.3 + bob, rg * H * 0.06 + H * 0.03, -H * 0.25 + bob, NOIR);
    const osc = Math.sin(t * 10) * H * 0.03;                                                   // les aiguilles bougent
    ell(rg * H * 0.26 - H * 0.09, -H * 0.22 + bob, rg * H * 0.26 + H * 0.09, -H * 0.06 + bob, laine, 0.8);
    for (const k of [-1, 1]) ligne([k * H * 0.06, -H * 0.16 + bob], [k * H * 0.2 + osc * k, -H * 0.5 + bob - Math.abs(osc)], "rgb(120,110,100)", 1.1);
  } else if (f.code === "patate") {
    const terre = [196, 160, 110];
    const bosses = [[0, -0.36, 0.3], [-0.16, -0.5, 0.2], [0.14, -0.22, 0.2], [0.12, -0.56, 0.16], [-0.1, -0.16, 0.18]];
    for (const [dx, dy, r] of bosses) disque(dx * H - r * H, dy * H + bob - r * H * 0.9, dx * H + r * H, dy * H + bob + r * H * 0.9, mul(terre, 0.55));
    for (const [dx, dy, r] of bosses) disque(dx * H - r * H + 1.3, dy * H + bob - r * H * 0.9 + 1.3, dx * H + r * H - 1.3, dy * H + bob + r * H * 0.9 - 1.3, mul(terre, 1));
    for (const [dx, dy] of [[-0.08, -0.3], [0.16, -0.44], [0.02, -0.12]]) disque(dx * H - H * 0.02, dy * H + bob - H * 0.015, dx * H + H * 0.02, dy * H + bob + H * 0.015, mul(terre, 0.75));
    disque(-H * 0.13, -H * 0.46 + bob, -H * 0.03, -H * 0.36 + bob, "rgb(250,250,250)", NOIR); disque(-H * 0.1, -H * 0.43 + bob, -H * 0.06, -H * 0.39 + bob, NOIR);
    disque(H * 0.08, -H * 0.38 + bob, H * 0.13, -H * 0.33 + bob, "rgb(250,250,250)", NOIR); disque(H * 0.095, -H * 0.365 + bob, H * 0.115, -H * 0.345 + bob, NOIR);
    ligne([-H * 0.04, -H * 0.26 + bob], [H * 0.06, -H * 0.24 + bob], NOIR, 1);
    for (const k of [-1, 1]) {
      const coude = [k * H * 0.44, -H * (k > 0 ? 0.5 : 0.26) + bob + pas * k * H * 0.04];
      ligne([k * H * 0.28, -H * 0.36 + bob], coude, "rgb(96,68,44)", 1.3);
      ligne(coude, [k * H * 0.5, -H * (k > 0 ? 0.58 : 0.2) + bob], "rgb(96,68,44)", 1.1);
      ligne([k * H * 0.08, -H * 0.06 + bob], [k * H * 0.1, H * 0.02 + bob], "rgb(96,68,44)", 1.4);
    }
    const hx = H * 0.1, hy = -H * 0.7 + bob - Math.max(0, -s.dy) * 0.35;            // le chapeau trop petit, de travers, saute avec retard
    disque(hx - H * 0.14, hy - H * 0.03, hx + H * 0.14, hy + H * 0.05, "rgb(70,60,70)");
    cx.fillStyle = "rgb(70,60,70)"; cx.fillRect(hx - H * 0.08, hy - H * 0.14, H * 0.16, H * 0.15);
  }
  cx.restore();
}

// ── la scène ──────────────────────────────────────────────────────────────────────────────────────────────
let PERSOS = [];
function dessiner(t) {
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, W, H); decor();
  const voies = PERSOS.length > 1 ? PERSOS.length : 1;
  PERSOS.forEach((f, i) => {
    const decal = PERSOS.length > 1 ? i * 2.3 : 0;                        // en défilé : chacun part à son tour
    const tt = t - decal; if (tt < 0) return;
    const tour = Math.floor(tt / f.duree), loc = tt % f.duree, dir = tour % 2 ? -1 : 1;
    const s = etat(f, loc);
    const larg = (f.emprise.x1 - f.emprise.x0) * f.echelle;
    const x = dir > 0 ? -larg / 2 - 80 + s.d : W + larg / 2 + 80 - s.d;
    const sol = PERSOS.length > 1 ? 560 + (i % 4) * 42 : 668;
    dessinerPerso(f, loc, x, sol, dir);
  });
}

async function filmer(sec, vers) {
  const flux = cv.captureStream(30);
  const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const rec = new MediaRecorder(flux, { mimeType: types.find(t => MediaRecorder.isTypeSupported(t)), videoBitsPerSecond: 3000000 });
  const bouts = []; rec.ondataavailable = e => e.data.size && bouts.push(e.data);
  const fini = new Promise(ok => rec.onstop = ok);
  rec.start(500); document.getElementById("etat").textContent = "enregistrement…";
  await new Promise(ok => setTimeout(ok, sec * 1000)); rec.stop(); await fini;
  const blob = new Blob(bouts, { type: "video/webm" });
  if (vers) { await fetch(vers, { method: "POST", body: blob }); document.title = "envoye"; return; }
  const a = document.createElement("a"); a.className = "lien"; a.href = URL.createObjectURL(blob);
  a.download = (Q.get("perso") || "marionnettes") + ".webm"; a.textContent = "Télécharger la vidéo";
  document.getElementById("barre").appendChild(a); document.getElementById("etat").textContent = "";
}

(async () => {
  await Promise.all(Object.keys(DECOR).map(async k => { DECOR[k] = await charger(DECOR[k]); }));
  // la liste des personnages = les dossiers de marionnettes/ (le serveur du site les liste) : rien à tenir à la main
  const page = await (await fetch("marionnettes/")).text().catch(() => "");
  const dossiers = [...new Set([...page.matchAll(/href="([0-9]{2}-[^"\/]+)\/"/g)].map(x => decodeURIComponent(x[1])))].sort();
  const liste = (await Promise.all(dossiers.map(async d => { const r = await fetch("marionnettes/" + d + "/montage.json"); return r.ok ? { id: d, nom: (await r.json()).nom } : null; }))).filter(Boolean);
  const sel = document.getElementById("choix");
  sel.innerHTML = '<option value="">Tous</option>' + liste.map(i => '<option value="' + i.id + '">' + i.nom + '</option>').join("");
  const id = Q.get("perso");
  sel.value = id || "";
  sel.onchange = () => { location.search = sel.value ? "?perso=" + sel.value : "?tous=1"; };
  const ids = id ? [id] : liste.map(i => i.id);
  PERSOS = (await Promise.all(ids.map(chargerPerso))).filter(Boolean);
  document.getElementById("filmer").onclick = () => filmer(20, null);
  if (FIGE !== null) { document.getElementById("barre").remove(); dessiner(FIGE); document.title = "pret"; return; }
  const t0 = performance.now();
  const boucle = () => { dessiner((performance.now() - t0) / 1000); requestAnimationFrame(boucle); };
  requestAnimationFrame(boucle);
  // l'aperçu direct : ses réglages (durée, adresse de retour) sont dans marionnettes/apercu.json, lus avec ?apercu=1
  if (Q.has("apercu")) {
    const a = await (await fetch("marionnettes/apercu.json")).json().catch(() => ({}));
    filmer(a.secondes || 20, a.vers || null);
  }
})();
