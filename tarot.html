<!-- =====================================================================
   RÈGLES DU JEU — TAROT FRANÇAIS (lues le 25/10 en entier : article « Tarot français » de Wikipédia
   et « Règlement officiel en donnes libres » de la Fédération française de tarot, 12 pages)
   ---------------------------------------------------------------------
   LE JEU : 78 cartes.
   - 4 couleurs de 14 cartes ; ici ce sont les 4 SAISONS (Printemps, Été, Automne, Hiver, validé par Florian le 26/10),
     de la plus forte à la plus faible :
     roi, dame, cavalier, valet (les honneurs), 10, 9, 8, 7, 6, 5, 4, 3, 2, as.
   - 21 atouts numérotés : le 21 est le plus fort, le 1 (« le petit ») le plus faible.
   - L'Excuse (l'étoile) : elle dispense de jouer la couleur ou l'atout demandé.
   - Les 3 BOUTS : le petit, le 21 et l'Excuse.
   - Valeurs : bout 4,5 · roi 4,5 · dame 3,5 · cavalier 2,5 · valet 1,5 · toute autre carte 0,5.
     Total : 91 points. (Ici on compte en demi-points, sans arrondi caché.)

   DISTRIBUTION ET CHIEN
   - Le donneur distribue 3 par 3, dans le sens contraire des aiguilles d'une montre (premier servi :
     son voisin de droite). En cours de route il pose une à une 6 cartes au CHIEN, jamais la première
     ni la dernière carte du paquet. Chacun reçoit 18 cartes. Le donneur change à chaque donne
     (son voisin de droite).
   - PETIT SEC : un joueur dont le seul atout est le petit, sans l'Excuse, le dit, montre son jeu
     et la donne est annulée : on redistribue. (Le jeu le fait tout seul.)

   ENCHÈRES (un seul tour, chacun parle une seule fois, en commençant à droite du donneur)
   - Passe, ou une enchère plus forte que la précédente, par ordre croissant :
     PETITE (prise) ×1 · GARDE ×2 · GARDE SANS le chien ×4 · GARDE CONTRE le chien ×6.
   - Si tout le monde passe, le voisin de droite du donneur redistribue.
   - Petite ou garde : le chien est retourné et montré à tous ; le preneur le prend dans sa main puis
     met 6 cartes de côté (l'ÉCART), qui comptent dans ses plis. On n'écarte ni roi ni bout ; un atout
     seulement s'il n'y a pas d'autre possibilité, et il est alors montré.
   - Garde sans : le chien reste caché et compte pour le preneur à la fin.
     Garde contre : le chien reste caché et compte pour la défense.
   - Le preneur joue seul contre les autres, qui défendent ensemble.

   LE JEU DE LA CARTE
   - Le voisin de droite du donneur entame ; on tourne dans le sens contraire des aiguilles d'une montre ;
     qui remporte un pli entame le suivant.
   - FOURNIR : à la couleur, on doit jouer la couleur demandée si on l'a (sans obligation de monter).
   - COUPER : sans la couleur demandée, on doit jouer atout ; si quelqu'un a déjà coupé, on doit
     SURCOUPER (un atout plus fort) si on le peut, sinon on joue un atout plus petit (« pisser »).
   - MONTER À L'ATOUT : à l'atout, on doit jouer plus fort que le plus fort atout déjà posé, même s'il
     est à un partenaire ; sinon on joue n'importe quel atout.
   - Sans couleur demandée ni atout : on joue la carte de son choix.
   - Si l'Excuse est entamée, c'est la carte suivante qui donne la couleur.
   - L'EXCUSE se joue à tout moment, à la place de n'importe quelle carte. Elle ne gagne jamais le pli
     (sauf chelem) mais reste à son camp, qui donne en échange une carte sans valeur (0,5) au camp qui a
     remporté le pli. Jouée au DERNIER pli, elle change de camp.
   - Le pli va au plus fort atout, sinon à la plus forte carte de la couleur demandée.

   LE COMPTE
   - Points à faire par le preneur selon les bouts dans ses plis (écart compris ; chien compris en garde sans) :
     0 bout 56 · 1 bout 51 · 2 bouts 41 · 3 bouts 36.
   - Demi-point : il va au camp gagnant (41,5 avec 2 bouts → 42, fait de 1 ; 40,5 → 40, chuté de 1).
   - Marque : (25 + écart entre points faits et points à faire) × 1, 2, 4 ou 6 selon le contrat,
     puis on ajoute les primes. Chaque défenseur marque ce total en moins si le preneur gagne, en plus s'il
     chute ; le preneur marque 3 fois ce total (2 fois à trois joueurs). La somme fait toujours 0.
   - PETIT AU BOUT : le camp qui remporte le dernier pli, si le petit y est, gagne 10 × le multiplicateur
     du contrat, quel que soit le résultat de la donne.
   - POIGNÉE : qui a 10 atouts (13 en double, 15 en triple ; à trois joueurs 13, 15, 18 ; l'Excuse compte
     comme un atout et signifie alors qu'on n'en a pas d'autre) peut la montrer juste avant de jouer sa
     première carte. Prime de 20, 30 ou 40, au camp qui GAGNE la donne. Ici on la propose simplement :
     un bouton « Montrer ma poignée » au moment de jouer sa première carte ; sinon on joue.
   - CHELEM : tous les plis. Non annoncé et réussi : +200 ; infligé au preneur par la défense : 200 pour
     chaque défenseur. (Pas d'annonce de chelem ici, pour rester simple.)

   À TROIS JOUEURS (option) : même règle, 4 cartes par 4, 24 cartes chacun, chien de 6 ;
   poignées 13, 15, 18 ; le preneur marque 2 fois le total.

   Les joueurs du village (Hugo, Chloé, Pierre) jouent selon ces mêmes règles et ne voient que ce
   qu'une joueuse verrait à leur place : leur main, la table, le chien quand il est montré.
   ===================================================================== -->

<script>
/* ===== Le tarot des saisons (26/10, Florian : « go pour les saisons »). Les 4 couleurs sont les 4 saisons :
   Printemps (fleur, rose), Été (soleil, jaune), Automne (feuille, orange), Hiver (flocon, bleu).
   Les cartes 1 à 10 restent classiques : le symbole répété autant de fois que la valeur, aux places d'un vrai jeu.
   Même matière que cartes-faces.js : papier grainé et toilé, liseré doré, ornements Vallée, reflet (définitions cf-*).
   Figures : le personnage de la Vallée en pied dans le cadre doré (cartes/tarot/<r|d|c|v>-<saison>.webp).
   Atouts et Excuse : une scène de la Vallée avec eux (cartes/tarot/atout-NN.webp, excuse.webp), numéro en médaillon.
   Numéros : 0-55 les saisons (saison × 14 + rang − 1 ; 11 valet, 12 cavalier, 13 dame, 14 roi), 56-76 atouts 1-21, 77 Excuse. ===== */
const SaisonsFaces=(function(){
  const INDEX="Georgia, 'Noto Serif', 'Times New Roman', serif";
  const SAISONS=['printemps','été','automne','hiver'], FICHIER=['printemps','ete','automne','hiver'];
  const NOMS_S=['Printemps','Été','Automne','Hiver'];
  const ENCRE=['#B8325E','#B07A06','#C2501A','#2A63A6'], TRAIT=['#6E1634','#6A4A00','#6E2A08','#123B6A'];
  const LETTRE={1:'A',11:'V',12:'C',13:'D',14:'R'};
  const chemin='cartes/tarot-saisons/';
  const figures=['r-automne','d-printemps'];   // les portraits déjà rendus (PC51, NoobAI, 26/10)
  const atouts=['atout-01','atout-06','atout-19','excuse'];   // les scènes déjà rendues (les autres attendent PC51 : fenêtre sombre)
  const SCENES=['Tout dort','Premiers pas','Rosée','Source','Matin clair','Ruisseau','Verger','Plein midi','Sieste','Colline','Chemin creux',
    'Clairière',"Fin d'après-midi",'Soleil bas','Étang','Feu du soir','Dernière lueur','Braises','Première neige',"Ciel d'hiver",'Étoiles sans batterie','Veillée'];
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* Les quatre symboles, dessinés dans une boîte de 100 × 100 : une silhouette franche, lisible même petite. */
  function symbole(s){
    if(s===0){ // fleur : cinq pétales ronds et un cœur doré
      const p=[0,72,144,216,288].map(a=>`<ellipse cx="50" cy="27" rx="17" ry="22" transform="rotate(${a} 50 52)"/>`).join('');
      return `<g fill="url(#sf-g0)" stroke="${TRAIT[0]}" stroke-width="3.5">${p}</g><circle cx="50" cy="52" r="13" fill="#F6C945" stroke="#8A5A00" stroke-width="3"/>`;
    }
    if(s===1){ // soleil : disque et douze rayons
      const r=[...Array(12)].map((_,k)=>`<path d="M50 2L56 18L44 18Z" transform="rotate(${k*30} 50 50)"/>`).join('');
      return `<g fill="url(#sf-g1)" stroke="${TRAIT[1]}" stroke-width="2.5" stroke-linejoin="round">${r}<circle cx="50" cy="50" r="26"/></g>`;
    }
    if(s===2){ // feuille d'érable
      return `<path d="M50 4L58 22L72 16L68 34L88 30L78 46L94 54L74 60L80 74L60 68L54 84L50 74L46 84L40 68L20 74L26 60L6 54L22 46L12 30L32 34L28 16L42 22Z" fill="url(#sf-g2)" stroke="${TRAIT[2]}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M50 30V97" stroke="${TRAIT[2]}" stroke-width="4.5" stroke-linecap="round"/><path d="M50 60L70 46M50 60L30 46" stroke="${TRAIT[2]}" stroke-width="2.4" stroke-linecap="round" fill="none"/>`;
    }
    // flocon : six branches à petites pointes
    const b=[...Array(6)].map((_,k)=>`<g transform="rotate(${k*60} 50 50)"><path d="M50 50V6M50 20L39 11M50 20L61 11M50 33L41 26M50 33L59 26"/></g>`).join('');
    return `<g stroke="${TRAIT[3]}" stroke-width="10" stroke-linecap="round" fill="none">${b}</g><g stroke="url(#sf-g3)" stroke-width="6" stroke-linecap="round" fill="none">${b}</g><circle cx="50" cy="50" r="8" fill="#DDEEFF" stroke="${TRAIT[3]}" stroke-width="2.5"/>`;
  }
  function sym(s,x,y,t,tete){
    return `<g transform="translate(${x-t/2} ${y-t/2}) scale(${t/100})${tete?' rotate(180 50 50)':''}">${symbole(s)}
      <ellipse cx="36" cy="30" rx="10" ry="5" transform="rotate(-35 36 30)" fill="#fff" fill-opacity=".45"/></g>`;
  }
  function installer(){
    if(document.getElementById('sf-defs')||!document.body) return;
    const d=document.createElement('div');
    d.innerHTML=`<svg id="sf-defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="sf-g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7A6C2"/><stop offset=".6" stop-color="#E06890"/><stop offset="1" stop-color="#B8325E"/></linearGradient>
      <linearGradient id="sf-g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE680"/><stop offset=".55" stop-color="#F6C02A"/><stop offset="1" stop-color="#D9920A"/></linearGradient>
      <linearGradient id="sf-g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6A04A"/><stop offset=".6" stop-color="#E26A1E"/><stop offset="1" stop-color="#B8460E"/></linearGradient>
      <linearGradient id="sf-g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8D4FF"/><stop offset=".6" stop-color="#5E9EE8"/><stop offset="1" stop-color="#2F6FB0"/></linearGradient>
      <clipPath id="sf-fenetre"><rect x="22" y="22" width="206" height="308" rx="8"/></clipPath>
      <clipPath id="sf-portrait"><rect x="60" y="30" width="130" height="290" rx="7"/></clipPath>
      <radialGradient id="sf-medaille" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFDF4"/><stop offset=".7" stop-color="#F6E6C0"/><stop offset="1" stop-color="#E4C98E"/></radialGradient>
      <linearGradient id="sf-ruban" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8E4"/><stop offset="1" stop-color="#EEDCB0"/></linearGradient>
    </defs></svg>`;
    document.body.appendChild(d.firstElementChild);
  }

  /* repris de cartes-faces.js : le papier, le reflet, l'ornement de coin, la couronne de l'as, les places */
  const papier=`<rect x="1.5" y="4.5" width="247" height="347" rx="16" fill="#C9B387"/>
    <rect x="1.5" y="3" width="247" height="347" rx="16" fill="#E2D2AC"/>
    <rect x="1.5" y="1.5" width="247" height="347" rx="16" fill="url(#cf-papier)" stroke="#8F7A52" stroke-width="1.6"/>
    <rect x="1.5" y="1.5" width="247" height="347" rx="16" fill="url(#cf-matiere)"/>
    <rect x="9" y="9" width="232" height="332" rx="11" fill="none" stroke="url(#cf-or)" stroke-width="2.4"/>
    <rect x="12.5" y="12.5" width="225" height="325" rx="9" fill="none" stroke="#B88A2E" stroke-opacity=".45" stroke-width=".8"/>`;
  const reflet=`<rect x="1.5" y="1.5" width="247" height="347" rx="16" fill="url(#cf-reflet)"/>`;
  const ouvre=(w,nom)=>`<svg class="cf" width="${w}" height="${Math.round(w*1.4)}" viewBox="0 0 250 352" role="img" aria-label="${esc(nom)}">`;
  function ornement(x,y,rot){
    return `<g transform="translate(${x} ${y}) rotate(${rot})">
      <path d="M0 0 Q18 4 30 -8 Q40 -18 54 -14" stroke="#6E7F3E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      ${[[10,1,-30],[22,-3,20],[34,-11,-25],[46,-15,25]].map(([a,b,r])=>`<ellipse cx="${a}" cy="${b}" rx="6.5" ry="3" transform="rotate(${r} ${a} ${b})" fill="#7E9C5B" stroke="#4E6630" stroke-width=".9"/>`).join('')}
      <circle cx="16" cy="6" r="2.6" fill="#C9473F" stroke="#6E1A14" stroke-width=".8"/><circle cx="20" cy="8" r="2.2" fill="#D9604A" stroke="#6E1A14" stroke-width=".8"/>
      <circle cx="56" cy="0" r="12" fill="#FFD77A" fill-opacity=".28"/>
      <line x1="56" y1="-16" x2="56" y2="-10" stroke="#5a4020" stroke-width="1.4"/>
      <path d="M48.5 -9 L56 -15 L63.5 -9Z" fill="#7A5418"/>
      <rect x="50" y="-9" width="12" height="15" rx="2" fill="#FFD77A" stroke="#7A5418" stroke-width="1.4"/>
      <rect x="53" y="-6" width="6" height="9" rx="1.2" fill="#FFF3C8"/>
      <rect x="49" y="6" width="14" height="2.6" rx="1" fill="#7A5418"/></g>`;
  }
  function couronne(){
    const feuilles=[...Array(18)].map((_,k)=>{ const a=k/18*2*Math.PI, x=125+Math.cos(a)*86, y=175+Math.sin(a)*96, r=a*180/Math.PI+90;
      return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="11" ry="4.6" transform="rotate(${r.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${k%2?'#7E9C5B':'#94B06A'}" stroke="#4E6630" stroke-width="1"/>`; }).join('');
    const baies=[0,3,6,9,12,15].map(k=>{ const a=k/18*2*Math.PI+.17; return `<circle cx="${(125+Math.cos(a)*88).toFixed(1)}" cy="${(175+Math.sin(a)*98).toFixed(1)}" r="4" fill="#D9604A" stroke="#6E1A14" stroke-width="1"/>`; }).join('');
    return `<ellipse cx="125" cy="175" rx="86" ry="96" fill="none" stroke="#B88A2E" stroke-opacity=".5" stroke-width="1.2"/>${feuilles}${baies}`;
  }
  /* Les places d'un jeu classique, réparties sur toute la hauteur de la carte (Florian, 26/10 : le 10 était tassé) :
     deux colonnes de quatre rangées régulières (64, 138, 212, 286) ; au 10, les deux du milieu entre les rangées 1-2 et 3-4. */
  const G=80, C=125, D=170, Hh=64, B=286, M=175, R2=138, R3=212;
  const PLACES={
    2:[[C,Hh],[C,B]], 3:[[C,Hh],[C,M],[C,B]],
    4:[[G,Hh],[D,Hh],[G,B],[D,B]], 5:[[G,Hh],[D,Hh],[C,M],[G,B],[D,B]],
    6:[[G,Hh],[D,Hh],[G,M],[D,M],[G,B],[D,B]],
    7:[[G,Hh],[D,Hh],[C,(Hh+M)/2],[G,M],[D,M],[G,B],[D,B]],
    8:[[G,Hh],[D,Hh],[C,(Hh+M)/2],[G,M],[D,M],[C,(M+B)/2],[G,B],[D,B]],
    9:[[G,Hh],[D,Hh],[G,R2],[D,R2],[C,M],[G,R3],[D,R3],[G,B],[D,B]],
    10:[[G,Hh],[D,Hh],[C,(Hh+R2)/2],[G,R2],[D,R2],[G,R3],[D,R3],[C,(R3+B)/2],[G,B],[D,B]]
  };
  const TAILLE={2:50,3:48,4:50,5:48,6:46,7:44,8:42,9:40,10:38};
  /* l'index peint : la valeur dans l'encre de la saison, le symbole dessous */
  function coin(L,s){
    const dix=L==='10';
    return `<text x="31" y="60" font-size="${dix?48:54}" text-anchor="middle" font-family="${INDEX}" font-weight="700" fill="${ENCRE[s]}" stroke="${TRAIT[s]}" stroke-width="1.2"${dix?' textLength="48" lengthAdjust="spacingAndGlyphs"':''}>${L}</text>${sym(s,31,90,34)}`;
  }
  const coins=(L,s)=>coin(L,s)+`<g transform="rotate(180 125 175)">${coin(L,s)}</g>`+ornement(186,40,0)+`<g transform="rotate(180 125 175)">${ornement(186,40,0)}</g>`;

  /* la figure : le personnage en pied, une seule tête, dans le cadre doré ; son nom de saison sur un ruban */
  function figure(r,s,w,nom){
    const L=LETTRE[r], cle=`${L.toLowerCase()}-${FICHIER[s]}`;
    const dedans=figures.includes(cle)
      ?`<image href="${chemin}${cle}.webp" x="60" y="30" width="130" height="290" preserveAspectRatio="xMidYMid slice" clip-path="url(#sf-portrait)"/>`
      :`<rect x="60" y="30" width="130" height="290" fill="#F4E6C6"/>${sym(s,125,150,90)}<text x="125" y="268" font-size="70" text-anchor="middle" font-family="${INDEX}" font-weight="700" fill="${ENCRE[s]}" stroke="${TRAIT[s]}">${L}</text>`;
    const coinF=`<text x="29" y="56" font-size="46" text-anchor="middle" font-family="${INDEX}" font-weight="700" fill="${ENCRE[s]}" stroke="${TRAIT[s]}" stroke-width="1.2">${L}</text>${sym(s,29,84,30)}`;
    return `${ouvre(w,nom)}${papier}${coinF}<g transform="rotate(180 125 175)">${coinF}</g>
      <rect x="54" y="24" width="142" height="302" rx="10" fill="#5A3A1E"/>${dedans}
      <rect x="54" y="24" width="142" height="302" rx="10" fill="none" stroke="url(#cf-or)" stroke-width="4.5"/>
      <rect x="60" y="30" width="130" height="290" rx="7" fill="none" stroke="#FFF1C8" stroke-opacity=".6" stroke-width="1"/>${reflet}</svg>`;
  }

  /* les atouts et l'Excuse (même dessin que la planche validée le 25/10) */
  const etoile=(x,y,r)=>{ const p=[...Array(10)].map((_,k)=>{ const a=-Math.PI/2+k*Math.PI/5, q=k%2?r*.45:r; return `${(x+Math.cos(a)*q).toFixed(1)},${(y+Math.sin(a)*q).toFixed(1)}`; }).join(' ');
    return `<polygon points="${p}" fill="url(#cf-or)" stroke="#7A5418" stroke-width="1.6" stroke-linejoin="round"/>`; };
  function medaillon(n){
    const dedans=n===0?etoile(46,50,22)
      :`<text x="46" y="${n>9?63:65}" font-size="${n>9?38:44}" text-anchor="middle" font-family="${INDEX}" font-weight="700" fill="#3A2210" stroke="#1E1006" stroke-width=".8"${n>9?' textLength="44" lengthAdjust="spacingAndGlyphs"':''}>${n}</text>${n===6||n===9?'<rect x="37" y="69" width="18" height="3.4" rx="1.7" fill="#3A2210"/>':''}`;   // 6 et 9 soulignés : lisibles à l'envers
    return `<circle cx="46" cy="50" r="31" fill="#3A2010" fill-opacity=".35" transform="translate(1.5 2.5)"/>
      <circle cx="46" cy="50" r="31" fill="url(#sf-medaille)" stroke="url(#cf-or)" stroke-width="4.5"/>
      <circle cx="46" cy="50" r="25.5" fill="none" stroke="#B88A2E" stroke-opacity=".7" stroke-width="1"/>${dedans}`;
  }
  function atout(n,w,nom){
    const f=n===0?'excuse':'atout-'+String(n).padStart(2,'0'), titre=n===0?'Excuse':SCENES[n], t=titre.length, fs=t>16?15:t>11?17:19;
    const img=atouts.includes(f)?`<image href="${chemin}${f}.webp" x="22" y="22" width="206" height="308" preserveAspectRatio="xMidYMid slice" clip-path="url(#sf-fenetre)"/>`:'';
    return `${ouvre(w,nom)}${papier}<rect x="22" y="22" width="206" height="308" rx="8" fill="#5A3A1E"/>${img}
      <rect x="22" y="22" width="206" height="308" rx="8" fill="none" stroke="url(#cf-or)" stroke-width="5"/>
      <rect x="27.5" y="27.5" width="195" height="297" rx="5" fill="none" stroke="#FFF1C8" stroke-opacity=".55" stroke-width="1"/>
      <g transform="translate(125 258)"><path d="M-78 -15H78L70 0L78 15H-78L-70 0Z" fill="url(#sf-ruban)" stroke="#8A5A22" stroke-width="2"/>
      <text y="6" font-size="${fs}" text-anchor="middle" font-family="${INDEX}" font-style="italic" fill="#4A2A12"${t>16?' textLength="132" lengthAdjust="spacingAndGlyphs"':''}>${esc(titre)}</text></g>
      ${medaillon(n)}<g transform="rotate(180 125 176)">${medaillon(n)}</g>${reflet}</svg>`;
  }

  function nom(id){
    if(id===77) return "l'Excuse";
    if(id>=56) return id===56?'le petit':"l'atout "+(id-55);
    const s=Math.floor(id/14), r=id%14+1, de=s===2?"d'Automne":s===3?"d'Hiver":s===1?"d'Été":'de Printemps';
    return (r===1?"l'as":r===11?'le valet':r===12?'le cavalier':r===13?'la dame':r===14?'le roi':'le '+r)+' '+de;
  }
  function face(id,w){
    if(id>=56) return atout(id===77?0:id-55,w,nom(id));
    const s=Math.floor(id/14), r=id%14+1, L=LETTRE[r]||String(r);
    if(r>10) return figure(r,s,w,nom(id));
    const milieu=r===1?couronne()+sym(s,125,175,112):PLACES[r].map(([x,y])=>sym(s,x,y,TAILLE[r],y>M)).join('');
    return `${ouvre(w,nom(id))}${papier}${coins(L,s)}${milieu}${reflet}</svg>`;
  }
  if(document.body) installer(); else addEventListener('DOMContentLoaded',installer);
  return {face,nom,installer,figures,atouts,SAISONS,NOMS_S,SCENES};
})();
</script>
<script>
/* ===================== LE MOTEUR : les règles écrites en tête de ce fichier ===================== */
const EXC=77, PETIT=56, VINGTETUN=76;
const COULEUR=['Printemps','Été','Automne','Hiver'];   // les 4 couleurs sont les 4 saisons
const DE=['de Printemps',"d'Été","d'Automne","d'Hiver"];
const BOTS=['Hugo','Chloé','Pierre'];   // les trois habitants du village, comme à la belote
const CONTRATS=['','Petite','Garde','Garde sans','Garde contre'];
const MULT=[0,1,2,4,6];
const isAtout=c=>c>=56&&c<=76;
const valAtout=c=>c-55;
const coul=c=>c<56?Math.floor(c/14):-1;          // -1 : atout ou Excuse
const rang=c=>c%14+1;
const isBout=c=>c===PETIT||c===VINGTETUN||c===EXC;
const isRoi=c=>c<56&&rang(c)===14;
/* valeur en demi-points : bout ou roi 9, dame 7, cavalier 5, valet 3, toute autre carte 1 (91 points en tout) */
const demi=c=>isBout(c)?9:c<56?({14:9,13:7,12:5,11:3}[rang(c)]||1):1;
const nomC=c=>SaisonsFaces.nom(c);
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const SEUILS=n=>n===4?[10,13,15]:[13,15,18];
const PRIMES=[20,30,40];
/* la main rangée : atouts du plus fort au plus petit, l'Excuse, puis les couleurs alternées, du roi à l'as */
function ranger(h){
  const ord=[0,1,2,3];
  const k=c=>c===EXC?-100:isAtout(c)?-200+(77-c):ord[coul(c)]*20+(15-rang(c));
  return [...h].sort((a,b)=>k(a)-k(b));
}

/* ---------- La donne : 3 par 3 (4 par 4 à trois), le chien carte par carte, jamais en premier ni en dernier ---------- */
function distribuer(st){
  const n=st.n, p=n===4?3:4, paquets=72/p, deck=shuffle([...Array(78).keys()]);
  const trous=new Set(shuffle([...Array(paquets-1)].map((_,k)=>k+1)).slice(0,6));
  st.hands=Array.from({length:n},()=>[]); st.chien=[];
  let i=0;
  for(let k=0;k<paquets;k++){
    const seat=(st.dealer+1+k)%n;
    for(let j=0;j<p;j++) st.hands[seat].push(deck[i++]);
    if(trous.has(k+1)) st.chien.push(deck[i++]);
  }
  st.hands=st.hands.map(ranger);
}
function nouvelleDonne(st,premiere){
  st.donne=(st.donne||0)+1;
  if(!premiere) st.dealer=(st.dealer+1)%st.n;   // le voisin de droite donne
  distribuer(st);
  Object.assign(st,{phase:'bid',bids:Array(st.n).fill(null),best:0,taker:null,contract:0,turn:(st.dealer+1)%st.n,
    trick:[],tricks:[],lastTrick:null,piles:{att:[],def:[]},adj:{att:0,def:0},ecart:[],ecartMontre:[],shown:{},primes:[],
    joue:Array(st.n).fill(false),say:{},result:null,sec:null,excuseDue:null});
  // petit sec : la donne est annulée avant les enchères
  const k=st.hands.findIndex(h=>h.filter(c=>isAtout(c)).length===1&&h.includes(PETIT)&&!h.includes(EXC));
  if(k>=0){ st.phase='petitsec'; st.sec=k; st.say={[k]:'J\'ai le petit sec !'}; }
}
function newGame(players,n){
  const st={v:1,rev:0,n,players,dealer:Math.floor(Math.random()*n),donne:0,scores:Array(n).fill(0),gameId:Math.random().toString(36).slice(2,9)};
  nouvelleDonne(st,true); return st;
}
const camp=(st,k)=>k===st.taker?'att':'def';

/* ---------- Ce que l'on a le droit de jouer, et pourquoi ---------- */
function legalInfo(hand,trick){
  const atouts=hand.filter(isAtout), ex=hand.includes(EXC)?[EXC]:[];
  const best=Math.max(0,...trick.map(t=>t.card).filter(isAtout).map(valAtout));
  const leadC=trick.map(t=>t.card).find(c=>c!==EXC);
  if(leadC===undefined) return {ok:[...hand],why:null};
  if(isAtout(leadC)){
    const plus=atouts.filter(c=>valAtout(c)>best);
    if(plus.length) return {ok:[...plus,...ex],why:'monter',best};
    if(atouts.length) return {ok:[...atouts,...ex],why:'pisser',best};
    return {ok:[...hand],why:'defausse-atout'};
  }
  const s=coul(leadC), memes=hand.filter(c=>coul(c)===s);
  if(memes.length) return {ok:[...memes,...ex],why:'fournir',lead:s};
  if(atouts.length){
    const plus=atouts.filter(c=>valAtout(c)>best);
    if(best&&plus.length) return {ok:[...plus,...ex],why:'surcouper',lead:s,best};
    if(best) return {ok:[...atouts,...ex],why:'souscouper',lead:s,best};
    return {ok:[...atouts,...ex],why:'couper',lead:s};
  }
  return {ok:[...hand],why:'defausse',lead:s};
}
function refus(info,c){
  const A=b=>"l'atout "+b;
  switch(info.why){
    case 'fournir': return `Vous avez des cartes ${DE[info.lead]} : il faut en jouer une${info.ok.includes(EXC)?" (ou l'Excuse)":''}.`;
    case 'monter': return `Atout demandé : il faut monter plus haut que ${A(info.best)}, vous en avez un plus fort.`;
    case 'pisser': return `Atout demandé : il faut jouer un atout, même plus petit.`;
    case 'couper': return `Vous n'avez pas de carte ${DE[info.lead]} : il faut couper avec un atout.`;
    case 'surcouper': return `Vous n'avez pas de carte ${DE[info.lead]} : il faut couper plus haut que ${A(info.best)}.`;
    case 'souscouper': return `Vous n'avez pas de carte ${DE[info.lead]} : il faut jouer un atout, même plus petit.`;
  }
  return 'Cette carte ne peut pas être jouée maintenant.';
}
/* le gagnant d'un pli (sans l'exception du chelem) */
function maitre(trick){
  let best=null;
  const at=trick.filter(t=>isAtout(t.card));
  if(at.length) return at.reduce((a,b)=>valAtout(b.card)>valAtout(a.card)?b:a);
  const leadC=trick.map(t=>t.card).find(c=>c!==EXC); if(leadC===undefined) return trick[0];
  for(const t of trick) if(t.card!==EXC&&coul(t.card)===coul(leadC)&&(!best||rang(t.card)>rang(best.card))) best=t;
  return best;
}

/* ---------- Les coups ---------- */
function apply(S0,seat,a){
  const st=clone(S0), err=e=>({error:e});
  st.say={};
  if(a.type==='redeal'){ if(st.phase!=='nobid'&&st.phase!=='petitsec') return err('');
    st.donne--; nouvelleDonne(st); return {st}; }   // même numéro de donne, le voisin de droite redonne
  if(a.type==='bid'){
    if(st.phase!=='bid') return err('Les enchères sont finies.');
    if(seat!==st.turn) return err(`Attendez votre tour : c'est à ${st.players[st.turn].name} de parler.`);
    const lv=a.level|0;
    if(lv&&lv<=st.best) return err(`${st.players[st.taker].name} a déjà dit « ${CONTRATS[st.best]} » : dites plus fort, ou passez.`);
    if(lv<0||lv>4) return err('');
    st.bids[seat]=lv;
    if(lv){ st.best=lv; st.taker=seat; }
    st.say[seat]=lv?CONTRATS[lv]+' !':'Je passe';
    const parle=st.bids.filter(b=>b!==null).length;
    if(parle<st.n){ st.turn=(st.turn+1)%st.n; return {st}; }
    if(!st.best){ st.phase='nobid'; return {st}; }
    st.contract=st.best;
    if(st.contract<=2){ st.phase='chien'; st.turn=st.taker; }
    else commencerJeu(st);
    return {st};
  }
  if(a.type==='prendreChien'){
    if(st.phase!=='chien'||seat!==st.taker) return err('');
    st.hands[seat]=ranger([...st.hands[seat],...st.chien]); st.phase='ecart'; return {st};
  }
  if(a.type==='ecart'){
    if(st.phase!=='ecart'||seat!==st.taker) return err('');
    const e=a.cards||[], h=st.hands[seat];
    const why=ecartRefus(h,e); if(why) return err(why);
    st.ecart=e; st.ecartMontre=e.filter(isAtout);
    st.hands[seat]=h.filter(c=>!e.includes(c));
    if(st.ecartMontre.length) st.say[seat]=`J'écarte ${st.ecartMontre.map(nomC).join(', ')}`;
    commencerJeu(st); return {st};
  }
  if(a.type==='poignee'){
    if(st.phase!=='play'||seat!==st.turn||st.joue[seat]||st.shown[seat]) return err('La poignée se montre juste avant de jouer sa première carte.');
    const p=poigneeDe(st,st.hands[seat]); if(!p) return err('Il faut au moins '+SEUILS(st.n)[0]+' atouts pour une poignée.');
    st.shown[seat]=p.cartes; st.primes.push({seat,prime:p.prime,niveau:p.niveau});
    st.say[seat]=['Poignée !','Double poignée !','Triple poignée !'][p.niveau];
    return {st};
  }
  if(a.type==='play'){
    if(st.phase!=='play') return err('');
    if(seat!==st.turn) return err(`Attendez votre tour : c'est à ${st.players[st.turn].name} de jouer.`);
    if(st.trick.length===st.n) return err('Un instant : le pli se ramasse.');
    const h=st.hands[seat], c=a.card;
    if(!h.includes(c)) return err('');
    const info=legalInfo(h,st.trick);
    if(!info.ok.includes(c)) return err(refus(info,c));
    st.hands[seat]=h.filter(x=>x!==c); st.trick.push({seat,card:c}); st.joue[seat]=true;
    if(st.trick.length<st.n) st.turn=(st.turn+1)%st.n;
    return {st};
  }
  if(a.type==='collect'){
    if(st.phase!=='play'||st.trick.length!==st.n) return err('');
    ramasser(st); return {st};
  }
  if(a.type==='next'){
    if(st.phase!=='done') return err('');

  }

}
function commencerJeu(st){
  st.phase='play'; st.turn=(st.dealer+1)%st.n; st.trick=[]; st.joue=Array(st.n).fill(false);
  if(st.contract<=2) st.piles.att.push(...st.ecart);
}
/* ce que le preneur ne peut pas mettre de côté */
function ecartRefus(h,e){
  if(e.length!==6) return 'Il faut mettre exactement 6 cartes de côté.';
  if(new Set(e).size!==6||e.some(c=>!h.includes(c))) return '';
  if(e.some(isRoi)) return 'On ne met pas un roi de côté.';
  if(e.some(isBout)) return 'On ne met pas le petit, le 21 ni l\'Excuse de côté.';
  const libres=h.filter(c=>c<56&&!isRoi(c)).length;
  if(e.some(isAtout)&&e.filter(c=>c<56).length<Math.min(6,libres)) return 'Un atout ne se met de côté que s\'il ne reste rien d\'autre.';
  return '';
}
function refusEcartCarte(h,choisies,c){
  if(isRoi(c)) return 'On ne met pas un roi de côté.';
  if(isBout(c)) return 'On ne met pas le petit, le 21 ni l\'Excuse de côté.';
  if(isAtout(c)){ const libres=h.filter(x=>x<56&&!isRoi(x)).length; if(libres>=6) return 'Un atout ne se met de côté que s\'il ne reste rien d\'autre : choisissez des cartes de couleur.'; }
  if(choisies.length>=6) return 'Six cartes suffisent : touchez une carte levée pour la reprendre.';
  return '';
}
function poigneeDe(st,h){
  const at=h.filter(isAtout).sort((a,b)=>b-a), ex=h.includes(EXC), tot=at.length+(ex?1:0), S=SEUILS(st.n);
  let niv=-1; S.forEach((s,k)=>{ if(tot>=s) niv=k; }); if(niv<0) return null;
  const besoin=S[niv];
  const cartes=at.length>=besoin?at.slice(0,besoin):[...at,EXC];   // l'Excuse seulement s'il manque un atout
  return {niveau:niv,prime:PRIMES[niv],cartes};
}
/* le pli ramassé : l'Excuse reste à son camp (contre une carte sans valeur), sauf au dernier pli */
function ramasser(st){
  const t=st.trick, dernier=st.hands.every(h=>!h.length);
  let w=maitre(t).seat;
  const e=t.find(x=>x.card===EXC);
  if(e&&dernier&&st.tricks.length&&st.tricks.every(p=>camp(st,p.winner)===camp(st,e.seat))) w=e.seat;   // chelem : l'Excuse gagne le dernier pli
  const cw=camp(st,w);
  for(const x of t){
    if(x.card===EXC&&!dernier&&camp(st,x.seat)!==cw){
      const ce=camp(st,x.seat); st.piles[ce].push(EXC); st.adj[ce]-=1; st.adj[cw]+=1;   // la carte sans valeur donnée en échange
    } else st.piles[cw].push(x.card);
  }
  st.tricks.push({cards:t,winner:w});
  st.lastTrick={cards:t,winner:w}; st.trick=[]; st.turn=w;
  if(dernier){ st.petitAuBout=t.some(x=>x.card===PETIT)?cw:null; compter(st); }
}
/* ---------- Le compte de fin de donne ---------- */
function compter(st){
  const n=st.n, m=MULT[st.contract];
  let attC=[...st.piles.att];
  if(st.contract===3) attC.push(...st.chien);
  let defC=[...st.piles.def]; if(st.contract===4) defC.push(...st.chien);
  const dAtt=attC.reduce((s,c)=>s+demi(c),0)+st.adj.att;
  const bouts=attC.filter(isBout);
  const besoin=[56,51,41,36][bouts.length];
  let pts=dAtt/2;
  if(pts%1) pts=Math.floor(pts)>=besoin?Math.ceil(pts):Math.floor(pts);   // le demi-point va au camp gagnant
  const ecartPts=pts-besoin, gagne=ecartPts>=0;
  const base=(25+Math.abs(ecartPts))*m;
  let total=gagne?base:-base;
  const lignes=[[`Contrat : (25 + ${Math.abs(ecartPts)}) × ${m} (${CONTRATS[st.contract].toLowerCase()})`,gagne?base:-base]];
  if(st.petitAuBout){ const v=10*m*(st.petitAuBout==='att'?1:-1); total+=v; lignes.push([`Petit au bout (${st.petitAuBout==='att'?'preneur':'défense'})`,v]); }
  for(const p of st.primes){ const v=gagne?p.prime:-p.prime; total+=v; lignes.push([`${['Poignée','Double poignée','Triple poignée'][p.niveau]} de ${st.players[p.seat].name}`,v]); }
  const plisAtt=st.tricks.filter(p=>camp(st,p.winner)==='att').length;
  if(plisAtt===st.tricks.length){ total+=200; lignes.push(['Chelem du preneur',200]); }
  if(plisAtt===0){ total-=200; lignes.push(['Chelem de la défense',-200]); }
  const gains=st.players.map((_,k)=>k===st.taker?total*(n-1):-total);
  gains.forEach((g,k)=>st.scores[k]+=g);
  st.result={gagne,pts,dAtt,besoin,bouts,ecartPts,lignes,total,gains,chien:[...st.chien],ecart:[...st.ecart],plisAtt};
  st.phase='done';
}

/* ---------- La vue d'une place : sa main, la table, rien d'autre ---------- */
function viewFor(st,seat){
  const v={...clone(st),you:seat};
  v.hands=st.hands.map((h,k)=>k===seat?[...h]:h.length);
  if(!(st.phase==='chien'||st.phase==='done')) v.chien=null;
  if(seat!==st.taker&&st.phase!=='done') v.ecart=null;
  v.chienN=st.chien.length;
  return v;
}

/* ===================== LES JOUEURS DU VILLAGE : ils ne voient que leur vue ===================== */
function evaluer(h,n){
  let p=0; const at=h.filter(isAtout), ex=h.includes(EXC);
  if(h.includes(VINGTETUN)) p+=10;
  if(ex) p+=8;
  if(h.includes(PETIT)) p+=at.length>=7?9:at.length>=5?7:4;
  p+=at.length*2+at.filter(c=>valAtout(c)>=16).length;
  for(let s=0;s<4;s++){
    const cs=h.filter(c=>coul(c)===s), R=cs.some(c=>rang(c)===14), D=cs.some(c=>rang(c)===13), C=cs.some(c=>rang(c)===12), V=cs.some(c=>rang(c)===11);
    p+=R&&D?10:R?6:D?3:0; if(C) p+=2; if(V) p+=1;
    if(cs.length>=5) p+=(cs.length-4)*2;
    if(!cs.length) p+=6; else if(cs.length===1) p+=3;
  }
  return n===4?p:p-12;
}
function choixEnchere(v){
  const p=evaluer(v.hands[v.you],v.n);
  const lv=p>=84?4:p>=70?3:p>=50?2:p>=40?1:0;
  return lv>v.best?lv:0;
}
function ecartAuto(h){
  const libres=h.filter(c=>c<56&&!isRoi(c));
  if(libres.length<6){ const at=h.filter(c=>isAtout(c)&&!isBout(c)).sort((a,b)=>a-b); return [...libres,...at.slice(0,6-libres.length)]; }
  // on vide d'abord les couleurs courtes (pour couper ensuite), en sauvant leurs honneurs
  const lg=s=>h.filter(c=>coul(c)===s).length;
  const tri=[...libres].sort((a,b)=>{
    const sa=coul(a), sb=coul(b), ra=h.some(c=>coul(c)===sa&&isRoi(c)), rb=h.some(c=>coul(c)===sb&&isRoi(c));
    const ka=(ra?20:0)+lg(sa), kb=(rb?20:0)+lg(sb);
    return ka-kb||demi(b)-demi(a);
  });
  return tri.slice(0,6);
}
function botMove(st){
  const k=st.turn, v=viewFor(st,k);
  if(v.phase==='bid') return {type:'bid',level:choixEnchere(v)};
  if(v.phase==='chien') return {type:'prendreChien'};
  if(v.phase==='ecart') return {type:'ecart',cards:ecartAuto(v.hands[k])};
  if(v.phase==='play'){
    if(!v.joue[k]&&!v.shown[k]){ const p=poigneeDe(v,v.hands[k]); if(p&&(k===v.taker||p.niveau>=1)) return {type:'poignee'}; }
    return {type:'play',card:choisirCarte(v)};
  }
  return null;
}
function choisirCarte(v){
  const me=v.you, h=v.hands[me], info=legalInfo(h,v.trick), ok=info.ok;
  if(ok.length===1) return ok[0];
  const att=me===v.taker, memeCamp=s=>(s===v.taker)===att;
  const vus=new Set([...v.tricks.flatMap(p=>p.cards.map(x=>x.card)),...v.trick.map(x=>x.card),...h]);
  const atoutsDehors=[...Array(21)].map((_,i)=>56+i).filter(c=>!vus.has(c));
  const coupees=new Set(); // couleurs où quelqu'un a déjà coupé ou défaussé
  for(const p of v.tricks){ const l=p.cards.map(x=>x.card).find(c=>c!==EXC); if(l!==undefined&&!isAtout(l)&&p.cards.some(x=>coul(x.card)!==coul(l)&&x.card!==EXC)) coupees.add(coul(l)); }
  const sansEx=ok.filter(c=>c!==EXC);
  const cout=c=>c===PETIT?100:c===EXC?50:demi(c)+(isAtout(c)?valAtout(c)/30:rang(c)/30);
  const moinsCher=l=>[...l].sort((a,b)=>cout(a)-cout(b))[0];
  // l'Excuse ne se garde pas pour le dernier pli
  if(h.includes(EXC)&&h.length<=2&&ok.includes(EXC)) return EXC;
  if(!v.trick.length){
    const choix=sansEx.length?sansEx:ok;
    const at=choix.filter(isAtout).sort((a,b)=>b-a);
    if(att&&at.length&&at.length>=atoutsDehors.length&&atoutsDehors.length>0){
      const fort=at.filter(c=>atoutsDehors.every(d=>d<c));
      return fort.length?fort[0]:at.filter(c=>c!==PETIT).pop()??at[0];
    }
    const rois=choix.filter(c=>isRoi(c)&&!coupees.has(coul(c)));
    if(rois.length) return rois[0];
    const coulL=choix.filter(c=>c<56);
    if(coulL.length){
      const lg=s=>h.filter(c=>coul(c)===s).length;
      return [...coulL].sort((a,b)=>(att?lg(b)-lg(a):lg(b)-lg(a))||demi(a)-demi(b)||rang(a)-rang(b))[0];
    }
    const pas=at.filter(c=>c!==PETIT); return pas.length?pas[pas.length-1]:choix[0];
  }
  const cur=maitre(v.trick), apres=v.n-1-v.trick.length, dernier=apres===0;
  const gagne=c=>maitre([...v.trick,{seat:me,card:c}]).seat===me;
  const preneurAJoue=v.trick.some(x=>x.seat===v.taker);
  if(memeCamp(cur.seat)){
    const sur=dernier||(!att&&preneurAJoue);
    if(sur){ const c=[...sansEx].sort((a,b)=>demi(b)-demi(a)||(isAtout(a)-isAtout(b)))[0]; if(c!==undefined) return c; }
    const sansPetit=sansEx.filter(c=>c!==PETIT); return moinsCher(sansPetit.length?sansPetit:ok);
  }
  const gagnantes=sansEx.filter(gagne);
  const valeurPli=v.trick.reduce((s,x)=>s+demi(x.card),0);
  if(gagnantes.length){
    const sures=gagnantes.filter(c=>c!==PETIT||dernier);
    if(sures.length){
      if(dernier) return [...sures].sort((a,b)=>demi(b)-demi(a)||cout(a)-cout(b))[0];
      if(valeurPli>=5||att) return [...sures].sort((a,b)=>isAtout(a)&&isAtout(b)?b-a:cout(b)-cout(a))[0];
      return moinsCher(sures);
    }
  }
  const pire=moinsCher(sansEx.length?sansEx:ok);
  if(ok.includes(EXC)&&(cout(pire)>=5)) return EXC;
  return pire;
}

<script>
/* ===================== L'ÉCRAN ===================== */

/* Comme la belote : chaque donne finie verse des pièces dans la caisse du village (même tablette) ;
   le village les ramasse et y ajoute des étoiles. La clé évite de payer deux fois la même donne. */

    localStorage.setItem('village:caisse', String((+localStorage.getItem('village:caisse')||0)+n)); }catch{}
}
const carte=(id,w)=>id==null?CartesFaces.dos(w,''):SaisonsFaces.face(id,w);

let S=null, V=null, mode=null, flash='', aide='', aideT=null, panel=null, setupN=4, choisies=[], pumpT=null;
const me=0;
const app=document.getElementById('app');
function save(){ if(S) ls.set('seul',JSON.stringify(S)); }

function posOf(v,seat){

function hudHTML(v){

/* Toute la table se mesure sur l'écran réel : la main d'abord, aussi grande que possible ; le pli dans la place qui reste. */
function layout(v){
  const vw=innerWidth, vh=innerHeight, portrait=vh>vw, nTot=Math.max(1,(v.hands[v.you]||[]).length);
  // en portrait, une grande main se tient sur deux rangées (la seconde devant la première) : les cartes restent grandes
  const rows=portrait&&nTot>10?2:1, n=Math.ceil(nTot/rows), lever=0.5;
  const avail=vw*(portrait?(rows>1?0.84:0.94):0.9);
  let Hc=portrait?vh*(rows>1?0.2:0.25):vh*0.36, W=Hc/1.4, step=n>1?Math.min(W*0.62,(avail-W)/(n-1)):W;

const PHRASES=['je laisse les autres prendre','je pense faire mes points si le chien m\'aide','je pense faire mes points avec le chien (points × 2)',

function renderGame(pan){

    }
    const wc=Math.round(Wp*0.7);
    mid=`<div class="milieu">${ench||`<div class="chien cache" style="--w:${wc}px">${Array.from({length:6},()=>`<span>${carte(null,wc)}</span>`).join('')}</div><span class="etiquette">le chien</span>`}</div>`;

    const wc=Math.min(Math.round(Wp*0.95),Math.floor((innerWidth*0.92-30)/6));

  const ecartMoi=v.phase==='ecart'&&v.taker===v.you;
  const handHTML=hand.map((c,k)=>{
    let cls='';

    ${myBubble}${poigHTML}
    <div class="main">${handHTML}</div>
    ${aide?`<div class="aide" role="alert" style="bottom:${hb+48}px">${esc(aide)}</div>`:''}

}

/* ---------- Gestes ---------- */
app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='fPrenom'){
    const n=document.getElementById('prenom').value.trim().slice(0,20);
    if(!n){ flash='Écrivez votre prénom.'; render(); return; }
    try{ localStorage.setItem(KR('nom'),n); }catch{} flash=''; render();
  }
});
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  switch(a){
    case 'n': setupN=+t.dataset.v; render(); break;
    case 'go': startSolo(); break;
    case 'reprendre': S=load(); if(S){ mode='seul'; ls.set('mode','seul'); refresh(); pump(); } render(); break;
    case 'maison': location.href='index.html'+location.search; break;
    case 'quitter': clearTimeout(pumpT); mode=null; ls.set('mode',null); panel=null; aide=''; S=null; V=null; render(); break;  // la partie en cours reste gardée
    case 'regles': panel='regles'; render(); break;
    case 'close': panel=null; render(); break;
    case 'menu': panel=panel==='menu'?null:'menu'; render(); break;
    case 'bid': {
      const lv=+t.dataset.v;
      if(V.phase!=='bid'||V.turn!==V.you){ say('Attendez votre tour pour parler.'); break; }

    case 'prendreChien': act({type:'prendreChien'}); break;
    case 'ecart':
      if(choisies.length!==6){ say(`Choisissez encore ${6-choisies.length} carte${6-choisies.length>1?'s':''} : touchez-les dans votre main.`); break; }
      { const c=choisies; choisies=[]; const r=apply(S,me,{type:'ecart',cards:c}); if(r.error!==undefined){ choisies=c; say(r.error); } else commit(r.st); }
      break;
    case 'ecartAuto': choisies=ecartAuto(V.hands[V.you]); render(); break;
    case 'poignee': act({type:'poignee'}); break;
    case 'next': act({type:'next'}); break;

  }
});
function tapCard(c){
  const v=V;
  if(v.phase==='ecart'){
    if(v.taker!==v.you){ say(`${v.players[v.taker].name} prépare son écart : un instant.`); return; }
    if(choisies.includes(c)){ choisies=choisies.filter(x=>x!==c); render(); return; }
    const r=refusEcartCarte(v.hands[v.you],choisies,c); if(r){ say(r); return; }
    choisies.push(c); render(); return;
  }
  if(v.phase==='bid'){ say('On fait d\'abord les enchères : les cartes se jouent ensuite.'); return; }
  if(v.phase==='chien'){ say(v.taker===v.you?'Touchez d\'abord « Prendre le chien ».':'On regarde le chien : les cartes se jouent ensuite.'); return; }
  if(v.phase==='nobid'||v.phase==='petitsec'){ say('On redonne les cartes : un instant.'); return; }
  if(v.phase!=='play') return;
  if(v.trick.length===v.n){ say('Un instant : le pli se ramasse.'); return; }
  if(v.turn!==v.you){ say(`Attendez votre tour : c'est à ${v.players[v.turn].name} de jouer.`); return; }
  const info=legalInfo(v.hands[v.you],v.trick);
  if(!info.ok.includes(c)){ say(refus(info,c)); return; }
  act({type:'play',card:c});
}
/* Au doigt : la carte touchée se soulève ; un toucher la joue, ou on la glisse vers le pli. Lâchée ailleurs, elle revient. */
let drag=null;
app.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.carte'); if(!t) return;
  drag={el:t,id:+t.dataset.id,x:e.clientX,y:e.clientY,moved:false};
  t.classList.add('tient'); try{ t.setPointerCapture(e.pointerId); }catch{}
});
app.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>12) drag.moved=true;
  if(drag.moved&&V?.phase==='play') drag.el.style.translate=`${dx}px ${dy}px`;
});
function finDrag(e,annule){
  if(!drag) return;
  const d=drag; drag=null;
  d.el.classList.remove('tient'); d.el.style.translate='';
  if(!annule&&(!d.moved||e.clientY-d.y<-Math.min(90,innerHeight*0.1))) tapCard(d.id);
}
app.addEventListener('pointerup',e=>finDrag(e,false));
app.addEventListener('pointercancel',e=>finDrag(e,true));
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(screen()==='game') render(); },120); });
async function keepAwake(){ try{ await navigator.wakeLock?.request('screen'); }catch{} }
document.addEventListener('click',keepAwake,{once:true});
